# Design-budget register (core contracts 2.2). Each entry: value (or UNKNOWN), unit, method: design-budget,
# sigma: choice (a choice has no uncertainty), rationale, used_by. Requirements reference entries by name and never
# restate a value. A value is filled when the first layer that tests against it is specified.
# Toolbox citations are to /home/luis/Projects/Web/avionics-toolbox at commit 8865850.

PM_min:
  value: 0.7853981633974483
  unit: rad
  method: design-budget
  sigma: choice
  rationale: >-
    45 degrees, stored in radians (pi/4 = 0.7853981633974483 rad; degrees appear only in user-facing text, core 3).
    The toolbox states one requirement for every controller loop, a 45 degree phase margin, "the middle of the 30–60°
    range of robust designs (Åström & Murray, Feedback Systems, §10.3)" (src/lib/sim/lab/blocks/controller.ts:45)
    and lists it as "a design choice derived by a stated rule" (docs/physics.md:13). Its rate loops are the symmetric
    optimum of Kessler (1958), whose spacing a = 1 + sqrt(2) gives exactly 45 degrees (src/lib/calc/loopshape.ts:5-8).
    The toolbox states no derivation of why 45 rather than another value in the 30-60 degree range: the stated rule
    is the mid-range convention.
  used_by: [QF-3, attitude-loop design]

chi2_gate_quantile:
  value: 0.999
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    The innovation gate for a k-dimensional measurement is the chi-square quantile at this probability: a measurement
    is rejected when its normalised innovation squared exceeds it (src/lib/physics/tuning.ts:9-11). At 0.999, "one
    good measurement in 1000 is wrongly rejected" (src/lib/physics/tuning.ts:23); docs/physics.md:143 states the same
    rule ("chi-square quantile at 99.9 % for the measurement's dimension"). The toolbox states no derivation of the
    number 0.999 beyond that false-rejection probability of 1e-3 (convention value).
  used_by: [QM-1, estimator gates]

p:
  value: UNKNOWN
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: "Required confidence or probability. No value yet; set when the first layer that tests QM-2, RK-1, RK-9, REC-2 or REC-3 against it is specified."
  used_by: [QM-2, RK-1, RK-9, REC-2, REC-3]

k:
  value: UNKNOWN
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: "Multiplier on the sigma of position and range margins. No value yet; set when the first layer that tests QS-3 or QO-2 against it is specified."
  used_by: [QS-3, QO-2]

b:
  value: UNKNOWN
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: "Allowed motion blur, in pixels (a dimensionless count of pixels). No value yet; set when the layer that tests QS-1 is specified."
  used_by: [QS-1]

E:
  value: UNKNOWN
  unit: m
  method: design-budget
  sigma: choice
  rationale: "Apogee error tolerance. To be derived from the accepted points lost in apogee scoring (see 30-rocket.md, RK-1); no value yet."
  used_by: [RK-1]

false_alarm_budgets:
  value: UNKNOWN
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: "False-alarm probability budget, one per detector (QX detectors, GS-6, flight-event detectors). No value yet; each is set when the first layer that tests its detector is specified, and the per-detector split will replace this single entry."
  used_by: [QX, GS-6, flight-event detectors]

cv_phase_budget:
  value: UNKNOWN
  unit: rad
  method: design-budget
  sigma: choice
  rationale: "Phase at crossover allowed to CV latency. No value yet; set when the layer that tests QS-4 is specified."
  used_by: [QS-4]

batch_plan:
  value: UNKNOWN
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: "The batch: vehicles x scenarios x draws x flight length, and the time window. A composite of several quantities, so its final form will be several entries; no value yet, set when the layer that tests SIM-3 is specified."
  used_by: [SIM-3]

tau_robustness_band:
  value: 0.3
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Relative half-width of the band over which the rate loop must meet QF-3: motor time constant tau in
    [(1 - 0.3), (1 + 0.3)] x the card's tau. Luis's choice (2026-09-30, decision 0005): the card's tau sigma is
    UNKNOWN, and Blaha 2024 reports, for the same vehicle, 20 ms on the bench against 26 ms in flight. B1 replay
    narrows the band later.
  used_by: [QF-3, rate-loop gain design]

inertia_robustness_band:
  value: 0.5
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Relative half-width of the band over which the rate loop must meet QF-3: each principal inertia in
    [(1 - 0.5), (1 + 0.5)] x the card's value. QF-2's alpha_max uses J at the top of this band (conservative tau_ref).
    Luis's choice (2026-09-30, decision 0005): the card's inertia sigma is UNKNOWN, and published Crazyflie inertias
    differ by up to about 47 %. B1 replay narrows the band later.
  used_by: [QF-2, QF-3, rate-loop gain design]

Ms_max:
  value: 2.0
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Largest allowed sensitivity peak M_s = max over omega of |1/(1 + L(j omega))|. Luis's choice (2026-09-30, decision
    0009): Åström & Murray, Feedback Systems, M_s <= 2 guarantees a gain margin of at least 2 (6 dB) and a phase
    margin of at least 2 arcsin(1/(2 M_s)) = 29 degrees. PM_min is stricter on phase; M_s covers gain, which a phase
    margin alone does not once the rate loop has a D term (quad L6).
  used_by: [QF-3, rate-loop gain design]

d_path_noise_budget:
  value: 0.5
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Largest allowed RMS contribution of the rate loop's D path to each motor's command at hover, with the sensor
    profile's noise, as a fraction of the thrust of one DShot step at hover (about 2.28 mN at 0.5 on the current card;
    the step itself is derived from the card and the DShot map). Luis's choice (2026-09-30, decision 0009): noise below
    the actuator's resolution. Revisit with bench motor-temperature data.
  used_by: [rate-loop gain design]

t4_pass_probability_tracking:
  value: 0.90
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Required probability, over sensor-noise realisations, that a tracking scenario (steps, chirps and every scenario
    not in the safety class) meets its predicate. Luis's choice (2026-09-30, decision 0009). With
    t4_confidence_tracking, Wilks' zero-failure count N = ceil(ln(1 - c)/ln p) gives 22 seeds (Wilks 1941, Ann. Math.
    Statist. 12:91-96).
  used_by: [quad L6 statistical passes (T3 Monte Carlo, T4 confirmation)]

t4_confidence_tracking:
  value: 0.90
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Confidence at which t4_pass_probability_tracking is demonstrated. Luis's choice (2026-09-30, decision 0009).
  used_by: [quad L6 statistical passes (T3 Monte Carlo, T4 confirmation)]

t4_pass_probability_safety:
  value: 0.95
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Required probability, over sensor-noise realisations, that a safety scenario (acro coupling, recoveries) meets its
    predicate. Luis's choice (2026-09-30, decision 0009). With t4_confidence_safety, Wilks' zero-failure count
    N = ceil(ln(1 - c)/ln p) gives 59 seeds (Wilks 1941, Ann. Math. Statist. 12:91-96).
  used_by: [quad L6 statistical passes (T3 Monte Carlo, T4 confirmation)]

t4_confidence_safety:
  value: 0.95
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Confidence at which t4_pass_probability_safety is demonstrated. Luis's choice (2026-09-30, decision 0009).
  used_by: [quad L6 statistical passes (T3 Monte Carlo, T4 confirmation)]

allan_check_confidence:
  value: 0.99
  unit: "1"
  method: design-budget
  sigma: choice
  rationale: >-
    Two-sided confidence of the Allan-deviation interval used by the quad L6 stage (a) T1 check (chi-square with the
    overlapping Allan variance's equivalent degrees of freedom, NIST SP 1065 (Riley 2008) §5.3.2 eq. 45 and §5.4.1
    Table 5). It sets the width of the bound, and so the record length at which the x 1.1 noise-density and
    bias-instability negative controls fall outside it. Luis's choice (2026-09-30, decision 0009).
  used_by: [quad L6 Allan check]
