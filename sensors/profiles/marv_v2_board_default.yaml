# Sensor profile: MARV V2 board default parts (core contracts 5, "Datasheet priors"). Figures are recorded as the
# table states them, in the datasheet's units (conversion to SI belongs to the profile flattener). A "±" figure is a
# datasheet tolerance recorded as its bound; it is not a 1-sigma, so sigma stays UNKNOWN.
profile: marv_v2_board_default

classes:
  imu:
    part: "TDK ICM-45686"
    entries:
      gyro_fsr:
        value: 4000
        unit: deg/s
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: 'gyro FSR up to ±4000 °/s'; the value is the largest full-scale range, ±."
      gyro_noise_density:
        value: 3.8
        unit: mdeg/s/sqrt(Hz)
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: '3.8 m°/s/√Hz'."
      gyro_zero_rate_offset:
        value: 0.4
        unit: deg/s
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: 'zero-rate offset ±0.4 °/s (board)'; the value is the ± tolerance, not a sigma."
      gyro_offset_tempco:
        value: 0.005
        unit: deg/s/degC
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: '±0.005 °/s/°C'; the value is the ± tolerance, not a sigma."
      accel_fsr:
        value: 32
        unit: g
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: 'accel FSR up to ±32 g'; the value is the largest full-scale range, ±."
      accel_noise_density:
        value: [70, 80, 110]
        shape: set
        unit: ug/sqrt(Hz)
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Keyed by full-scale range: 70 / 80 / 110 µg/√Hz at ≤ 8 / 16 / 32 g respectively."
      accel_offset:
        value: 20
        unit: mg
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: 'offset ±20 mg (board)'; the value is the ± tolerance, not a sigma."
      odr:
        value: [12.5, 6400]
        shape: range
        unit: Hz
        method: datasheet
        source: "DS-000489 rev 1.1, tables 1–2"
        sigma: UNKNOWN
        status: [UNVERIFIED]
        note: "board parts not yet confirmed against the KiCad schematic (core §2.3). Table: 'ODR 12.5–6400 Hz'; [min, max]."
  high_g_accel:
