        value: 14
        unit: "1"
        method: datasheet
        source: "Hobbywing Xrotor 2306 Race Pro product page, https://www.hobbywing.com/en/products/xrotor-2306-race-pro167 (fetched 2026-09-29): stator 12S, rotor 14P, same for the 1600/1750/2400/2700 KV variants"
        sigma: exact
        status: [INFERRED]
        note: "Bauersfeld et al. 2021 §IV-B names only 'Hobbywing XRotor 2306 motors' (no variant or KV); the Race Pro is the only Hobbywing 2306 found, so the variant match is inferred"
