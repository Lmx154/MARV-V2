# The blast-radius map: which test groups a change can affect. ci/affected.py reads it; `ci/affected.py --check-manifest`
# keeps it in step with ci/run_ci.sh, ci/run_ci_gz.sh and the repository.
#
# How a changed path is classified (ci/affected.py):
#   0. It matches a glob under ignore_first (agent and editor files): it selects nothing, wherever it is.
#   1. It matches a glob under full_roots: the change selects everything.
#   2. Otherwise every rule whose `paths` match it contributes its selections (the union of all matching rules).
#   3. Otherwise, if it matches a glob under ignore, it selects nothing (a rule match wins over ignore).
#   4. Otherwise it is unmapped, and an unmapped path selects everything (fail-safe: a new file the map has not
#      heard of is never silently skipped). A deleted or renamed path counts under its old and its new name.
# When unsure, a rule selects more.
#   5. A rule may carry `like: [paths]`: the rule also selects what each listed path selects (a CMakeLists.txt that
#      selects what its directory's other files select).
#   6. design/budget.yaml is classified at key level (section budget_register below) when ci/affected.py can diff it
#      against the base; without the diff it is a full root (design/**).
#
# CMakeLists.txt: a <dir>/CMakeLists.txt selects what the rest of <dir> selects. In fw/prim, fw/types, fw/hal (and
# fw/hal/sim), fw/params, fw/sil and tools/gen that is everything (the directory is a full root: every library, every
# parameter set or every SIL library is built by it). The top-level CMakeLists.txt, CMakePresets.json, cmake/** and
# tests/regression/CMakeLists.txt (the layer-label machinery of every test) stay full-suite on purpose.
#
# Globs match the whole repository-relative path. `*` and `?` do not cross `/`; `**/` matches any number of directories
# (including none) and a trailing `**` matches the rest of the path.
#
# Identifiers:
#   ctest_labels   L00 L01 L02 L03 L04 L05 L06 L07 L08 L09 L11 (one per tests/regression/quad/Lnn directory that has a CMakeLists.txt, i.e.
#                  ctest entries; L10 holds a gz pytest only).
#   run_ci_steps   the function name passed to `step` in ci/run_ci.sh; host_preset is split by argument
#                  (host_preset:host-debug, host_preset:host-release). `uv sync --frozen` always runs and is not selectable.
#                  An entry `@name` expands the named list under step_groups.
#   pytest_paths   a pytest directory run by the tools_tests step (tests/regression/quad/Lnn/tools, tests/tools). L02/tools
#                  runs in the gz group l2, not here.
#   gz_groups      the groups of ci/run_ci_gz.sh: l2 l4 l5 l7 l11.
#
# Dependency facts behind the rules (target_link_libraries and the readers of each file):
#   libraries      sched -> compositions l0, l4, l5, l11, quad_fc (tested by L09). gyro_chain, rate, rate_group -> l4, l5, l11 and L06 (the rate_group
#                  tests link sil_l4). mixer -> L03, L04, L05, L06, L11. attitude -> L05, L09 (quad_fc), L11. vertical -> L11.
#   compositions   l0 -> L00 (and gz l4, l5: the L06 gz_compositions tests build marv_sil_l0 as a control). l2_open_loop -> L02,
#                  L04 (truth_gyro), L06 (adapter); gz l2 and l4 (both build host-gz). l4_rate_scripted -> L04, L06.
#                  l5_attitude_scripted -> L05; gz l5, l11 (the L11 group builds host-gz-l5). l11_vertical_scripted -> L11.
#                  l7_attitude_estimated -> gz l7 (host-gz-l7; it includes l5_script.hpp and reads the l5 and quad_fc registers).
#   plant, adapter marv_plant and marv_gz_adapter are linked by the L01, L02, L04 (truth_gyro), L05 (truth_attitude), L06 and
#                  L11 (truth_vertical_source) tests.

# Path globs whose change selects everything. These are the code every library, every test and every build is made of,
# and the machinery that runs the tests (changing the test machinery tests everything).
full_roots:
  - fw/prim/**
  - fw/types/**
  - fw/hal/**
  - fw/params/**
  - fw/sil/**
  - tools/gen/**
  - tools/ci/pytest_file_time_guard.py
  - design/**
  - CMakeLists.txt
  - CMakePresets.json
  # cmake/pico_sdk.cmake has its own rule (the m33 build only); a new cmake/ file is unmapped, so it selects everything.
  - cmake/flags.cmake
  - cmake/flight_targets.cmake
  - cmake/googletest.cmake
  - cmake/marv_card_gen.cmake
  - cmake/marv_test_timeout.cmake
  - cmake/reference_data.cmake
  - pyproject.toml
  - uv.lock
  - .github/**
  - tests/regression/CMakeLists.txt
  - tests/regression/quad/L06/controls/test_per_push_pytest_overrun.py
  - ci/Dockerfile*
  - ci/run_ci.sh
  - ci/run_ci_gz.sh
  - ci/local_ci.sh
  - ci/peakmem.sh
  - ci/dev_check.sh
  - ci/runner_resources/**
  - ci/blast_radius.yaml
  - ci/affected.py

# Agent and editor files: they select nothing wherever they are, even inside a full root or under a rule's directory (an
# editor's swap file beside fw/rate/src/rate.cpp is not a change to fw/rate). Checked before everything else.
ignore_first:
  - .serena/**
  - .vscode/**
  - .idea/**
  - "**/*.swp"
  - "**/*.swo"
  - "**/*~"

# Paths that select nothing.
ignore:
  - .claude/**
  - tools/target/**   # bench-only scripts (flashing); never run by CI (decision 0027)
  - docs/**
  - tests/regression/quad/L09/results/**   # bench logs (M1 P9, P11): evidence only, read by no test
  - tests/regression/quad/L10/results/**   # HIL S2e run reports and traces: evidence only, read by no test
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - datasheets/**
  - .gitignore
  - "**/.gitkeep"
  - tests/**/README.md

# Steps that only the full merge run executes. They are not selected by any rule. `uv sync --frozen` always runs and is
# not in this list.
merge_only_steps:
  - host_preset:host-release
  - per_push_timeout_applied
  - per_push_timeout_control
  - per_push_pytest_guard_applied
  - per_push_pytest_control
  - regression_change_check
  - blast_radius_manifest

# Named step lists, used as `@name` in a rule's run_ci_steps.
step_groups:
  host:
    - host_preset:host-debug
  # What every change under fw/ can break besides the tests: the flight gates and the product parameter tables.
  flight_gates:
    - g1_lint
    - constants_check
    - g3_host_symbols
    - g3_host_includes
    - g3_host_exports
    - m33_build
    - g3_m33_symbols
    - g3_m33_includes
    - product_table_host
    - product_table_m33
    - host_preset:host-debug
  # The checks on the SIL libraries a sim/ directory defines.
  sil_gates:
    - g3_host_symbols
    - g3_host_includes
    - g3_host_exports
    - host_preset:host-debug
  g1_controls:
    - g1_literal_control
    - g1_constexpr_control
    - g1_nolint_control
  constants_controls:
    - constants_uncited_control
    - constants_vehicle_number_control
  g3_controls:
    - g3_symbol_control
    - g3_m33_symbol_control
    - g3_include_control
    - g3_object_control
    - g3_m33_object_control
    - g3_interface_control
    - g3_forced_control
    - g3_export_control
    - g3_plant_control
    - g3_truth_unflagged_control
    - g3_truth_planted_control
    - g3_truth_vertical_unflagged_control
    - g3_truth_vertical_planted_control
    - g3_truth_vertical_missing_control
  # The checks that read the card tools: the card lint, the run report, the product tables, the Q of the T3 oracles.
  card_gates:
    - host_preset:host-debug
    - m33_build
    - product_table_host
    - product_table_m33
    - product_table_control
    - l1_card_lint
    - l1_card_lint_control
    - l1_flatten_control
    - l1_pyyaml_control
    - l1_report
    - att_t3_reference_reproduces
    - att_t3_reference_control
    - tools_tests

# Card and profile files. A file matching `globs` that something consumes selects what `consumed_like` (the committed
# card) selects, besides its own rule: ci/affected.py scans every tracked file that is not ignored, not in scan_exclude and
# not the file itself for its path or its file name stem (whole word), in CMakeLists.txt and *.cmake files, fw/, tools/,
# tests/, and in other cards and profiles that are themselves consumed (a profile is named by the card that uses it). A file
# nothing consumes selects only the lint rule below. Without that scan (a caller that cannot make it) every such file counts
# as consumed.
card_files:
  globs: [vehicles/**, sensors/profiles/**]
  consumed_like: vehicles/uzh_neurobem_5in.yaml
  scan_exclude: [ci/blast_radius.yaml, ci/affected.py, tests/tools/test_affected.py]

# The design-budget register, design/budget.yaml, classified at key level. ci/affected.py diffs the file between the
# base and the head, key by key, and a changed key selects its readers. A reader is a tracked file that names the key
# (a whole-word scan of every tracked file that is not ignored and not a derived copy), selected exactly as if that file
# had changed, plus the extra_readers below. A key with no scannable name (shorter than scan_min_name_length) or an
# unreadable diff selects the full suite, and the reason is printed. Every byte change of the file also selects any_change
# (what reads the whole file: its hash, the generated tables, its lint); a key that gains or loses its parameter, or
# changes unit, sigma or method, also selects structural (the id manifests and the product tables).
budget_register:
  file: design/budget.yaml
  # A key whose only changed fields are these is a text change: it selects any_change only.
  text_fields: [rationale, used_by]
  scan_min_name_length: 4
  # Tracked files the scan does not read, on top of every `ignore` glob: copies of values that the tools reading the
  # key regenerate (their readers are scanned), and the register files and this map themselves.
  scan_exclude:
    - design/**
    - ci/blast_radius.yaml
    - ci/affected.py
    - tests/tools/test_affected.py
    - tests/regression/quad/*/param_ids
    - tests/regression/quad/L06/product_params/**
    - tests/regression/quad/*/results/**/*.txt
    - tests/regression/quad/*/results/**/SHA256SUMS
  # Files that name a key without reading its value.
  mentions:
    - keys: [t4_settle_fraction]
      paths: [tools/sim/t4_rule.py]
      why: "t4_rule.py names the key in two comments; its caller reads the value (test_t4_steps and the other T4 tests)"
  # Readers the scan cannot see.
  extra_readers:
    - keys: [t4_pass_probability_tracking, t4_pass_probability_safety, t4_confidence_tracking, t4_confidence_safety]
      paths: [tools/sim/l6_noise_term.py]
      why: "l6_noise_term.py reads f\"t4_pass_probability_{klass}\" and f\"t4_confidence_{klass}\""
  any_change:
    ctest_labels: [L11]
    run_ci_steps:
      - host_preset:host-debug
      - m33_build
      - product_table_host
      - product_table_m33
      - l1_card_lint
      - l1_report
      - tools_tests
    pytest_paths:
      - tests/regression/quad/L01/tools/test_card_lint.py
      - tests/regression/quad/L01/tools/test_flatten_report.py
      - tests/regression/quad/L06/tools/test_l6_ff_eval.py
    gz_groups: []
    why: "the register is a build input of every product parameter set: the generated tables are compared byte for byte (product_table_host, product_table_m33, built by host-debug and m33), the run report holds its hash, the card lint lints it, test_flatten_report checks every entry and its hash, and l6_ff_eval's card_worst.txt records its SHA-256; L11 is the label of the product set's composition smoke test (ci/smoke.sh)"
  structural:
    ctest_labels: [L04, L05, L11]
    run_ci_steps: []
    pytest_paths:
      - tests/regression/quad/L01/tools/test_card_lint.py
      - tests/regression/quad/L01/tools/test_flatten_report.py
      - tests/regression/quad/L04/tools/test_rate_design.py
      - tests/regression/quad/L04/tools/test_scenario_values.py
      - tests/regression/quad/L05/tools/test_attitude_design.py
    gz_groups: []
    why: "an entry that becomes (or stops being) a parameter changes the product id set: the tests that read the param_ids manifests, and the L04, L05 and L11 composition param_ids checks (check_param_ids.py) that compare the product manifest with each composition's"

rules:
  # ---------------------------------------------------------------- the m33 build
  - paths: [boards/**, cmake/pico_sdk.cmake]
    ctest_labels: []
    run_ci_steps:
      - m33_build
      - product_table_m33
      - g3_m33_symbols
      - g3_m33_includes
      - pb2_negative_control
      - g3_m33_symbol_control
      - g3_m33_object_control
    pytest_paths: []
    gz_groups: []
    why: "the Pico SDK pin and the board header are read only when MARV_TARGET is m33 (CMakeLists.txt); the host presets and the gz builds never include them"

  - paths: [boards/parts/**]
    ctest_labels: [L09]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: []
    why: "a part header (boards/parts/lsm6dsv.hpp) is included by marv_lsm6dsv_decode (fw/hal/target/decode), built on the host too and tested by the L09 decode test; boards/** adds the m33 steps"

  # ---------------------------------------------------------------- fw: the libraries
  - paths: [fw/sched/**]
    ctest_labels: [L00, L04, L05, L06, L09, L11]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l4, l5, l7, l11]
    why: "sched is linked by the compositions l0, l4, l5, l11 and quad_fc"

  - paths: [fw/gyro_chain/**]
    ctest_labels: [L04, L05, L06, L09, L11]
    run_ci_steps: ["@flight_gates", tools_tests]
    pytest_paths: [tests/regression/quad/L06/tools]
    gz_groups: [l4, l5, l7, l11]
    why: "gyro_chain is linked by rate_group (so by the quad_fc L09 test) and the L04/L05/L06 T3 tests; L06 tools compile fw/gyro_chain/src"

  - paths: [fw/rate/**]
    ctest_labels: [L04, L05, L06, L09, L11]
    run_ci_steps: ["@flight_gates", tools_tests]
    pytest_paths: [tests/regression/quad/L06/tools]
    gz_groups: [l4, l5, l7, l11]
    why: "rate is linked by rate_group (so by the quad_fc L09 test) and the L04/L05 tests; L06 tools drive RateLoop"

  - paths: [fw/rate_group/**]
    ctest_labels: [L04, L05, L06, L09, L11]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l4, l5, l7, l11]
    why: "rate_group is linked by the compositions l4, l5, l11 and quad_fc and by the L06 rate_group tests"

  - paths: [fw/mixer/**]
    ctest_labels: [L03, L04, L05, L06, L09, L11]
    run_ci_steps: ["@flight_gates", tools_tests]
    pytest_paths: [tests/regression/quad/L06/tools]
    gz_groups: [l4, l5, l7, l11]
    why: "mixer is linked by the L03 and L09 tests, rate, rate_group, vertical and the compositions; L06 tools compile with fw/mixer/include"

  - paths: [fw/arming/**]
    ctest_labels: [L08, L09]
    run_ci_steps: ["@host"]
    pytest_paths: []
    gz_groups: [l7]
    why: "arming is the pure arming and failsafe machine, tested by the L08 unit_arming host test and linked by the quad_fc composition (the L09 gate test, and the L10 plumbing test in gz group l7)"

  - paths: [fw/estimator/**]
    ctest_labels: [L07, L09]
    run_ci_steps: ["@host"]
    pytest_paths: []
    gz_groups: [l7]
    why: "estimator is the pure Mahony attitude filter and the boot gyro calibration, tested by the L07 unit_mahony and unit_gyro_cal host tests and linked by the quad_fc composition (the L09 gate test)"

  - paths: [fw/attitude/**]
    ctest_labels: [L05, L09, L11]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l5, l7, l11]
    why: "attitude is linked by the compositions l5, l11 and quad_fc (angle mode, the L09 gate test)"

  - paths: [fw/stick_rates/**]
    ctest_labels: [L08, L09]
    run_ci_steps: ["@host"]
    pytest_paths: []
    gz_groups: [l7]
    why: "stick_rates (the QF-1 rates curve) is linked by the L08 unit test and by the quad_fc composition (the L09 gate test, and the L10 plumbing test in gz group l7)"

  - paths: [fw/vertical/**]
    ctest_labels: [L11]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l11]
    why: "vertical is linked by the composition l11 only"

  # ---------------------------------------------------------------- fw: the compositions
  - paths: [fw/compositions/l0/**]
    ctest_labels: [L00]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l4, l5]
    why: "l0 is the L00 composition and the control SIL of the L06 gz_compositions tests"

  - paths: [fw/compositions/l2_open_loop/**]
    ctest_labels: [L02, L04, L06]
    run_ci_steps: ["@flight_gates", tools_tests]
    pytest_paths: []
    gz_groups: [l2, l4]
    why: "l2_open_loop is the SIL of the L02 tests, L04 truth_gyro, L06 adapter and the host-gz plugin (gz l2 and l4)"

  - paths: [fw/compositions/l4_rate_scripted/**]
    ctest_labels: [L04, L06]
    run_ci_steps: ["@flight_gates", tools_tests]
    pytest_paths: [tests/regression/quad/L04/tools, tests/regression/quad/L06/tools]
    gz_groups: [l4]
    why: "l4_rate_scripted is the L04 and L06 SIL; its register is read by L04 and L06 tools tests"

  - paths: [fw/compositions/l5_attitude_scripted/**]
    ctest_labels: [L05]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l5, l7, l11]
    why: "l5_attitude_scripted is the L05 SIL; the L11 gz group builds host-gz-l5"

  - paths: [fw/compositions/l7_attitude_estimated/**]
    ctest_labels: [L07]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l7]
    why: "l7_attitude_estimated is the L07 SIL (the estimator the only attitude source), the plugin of host-gz-l7; it includes l5_script.hpp and reads the l5 and quad_fc registers"

  - paths: [fw/compositions/l11_vertical_scripted/**]
    ctest_labels: [L11]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l11]
    why: "l11_vertical_scripted is the L11 SIL"

  - paths: [fw/compositions/quad_fc/**]
    ctest_labels: [L09]
    run_ci_steps: ["@flight_gates"]
    pytest_paths: []
    gz_groups: [l7]
    why: "quad_fc is the flight composition of the m33 image and is linked by the L09 gate test and the SIL library sim/quad_fc (the L09 SIL test); its register and its scenario-values register are read by the marv_params_fc3v2 set built by the same tests"

  # ---------------------------------------------------------------- sim
  - paths: [sim/plant/**]
    ctest_labels: [L01, L02, L04, L05, L06, L11]
    run_ci_steps: ["@host", tools_tests]
    pytest_paths: [tests/regression/quad/L01/tools, tests/regression/quad/L06/tools]
    gz_groups: [l2, l4, l5, l7, l11]
    why: "marv_plant is linked by every plant, adapter and plugin test; L01 and L06 tools read its sources"

  - paths: [sim/gz/**]
    ctest_labels: [L02, L04, L05, L06, L11]
    run_ci_steps: ["@host", tools_tests]
    pytest_paths: [tests/regression/quad/L04/tools, tests/regression/quad/L05/tools, tests/regression/quad/L06/tools]
    gz_groups: [l2, l4, l5, l7, l11]
    why: "the adapter and the plugin are linked by the L02/L04/L05/L06/L11 tests and are every gz group's plugin"

  - paths: [sim/common/**, sim/l6_noise_run/**]
    ctest_labels: [L06]
    run_ci_steps: ["@host"]
    pytest_paths: []
    gz_groups: []
    why: "the sha256 header and the noise run driver are used by the L06 noise and sim2 tests only"

  - paths: [sim/null_plant/**]
    ctest_labels: [L00, L06]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l4, l5]
    why: "null_plant builds marv_sil_l0, the L00 replay, the L06 noise test (includes its headers) and the control SIL of the L06 gz_compositions tests"

  - paths: [sim/l2_open_loop/**]
    ctest_labels: [L02, L04, L06]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l2, l4]
    why: "the SIL library marv_sil_l2_open_loop is the plugin of host-gz (gz l2 and l4)"

  - paths: [sim/l4_rate_scripted/**]
    ctest_labels: [L04, L06]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l4]
    why: "the SIL library marv_sil_l4_rate_scripted is the plugin of host-gz-l4 and the L06 sim2 driver's"

  - paths: [sim/l5_attitude_scripted/**]
    ctest_labels: [L05]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l5, l11]
    why: "the SIL library marv_sil_l5_attitude_scripted is the plugin of host-gz-l5 (gz l5 and l11)"

  - paths: [sim/l7_attitude_estimated/**]
    ctest_labels: [L07]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l7]
    why: "the SIL library marv_sil_l7_attitude_estimated is the plugin of host-gz-l7"

  - paths: [sim/l11_vertical_scripted/**]
    ctest_labels: [L11]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l11]
