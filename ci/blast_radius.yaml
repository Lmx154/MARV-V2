  - paths: [sim/quad_fc/**]
    ctest_labels: [L09]
    run_ci_steps: ["@sil_gates"]
    pytest_paths: []
    gz_groups: [l7]
    why: "the SIL library marv_sil_quad_fc (the flight composition with the FC3v2 set and the staged ManualControl, HIL S2c) is linked by the L09 SIL test and is the plugin of host-gz-quadfc (the L10 plumbing test, gz group l7)"

  # ---------------------------------------------------------------- tools
  - paths: [tools/card/**]
    ctest_labels: [L00, L01, L02, L03, L04, L05, L06, L07, L08, L09, L11]
    run_ci_steps: ["@card_gates"]
    pytest_paths:
      - tests/regression/quad/L01/tools
      - tests/regression/quad/L03/tools
      - tests/regression/quad/L04/tools
      - tests/regression/quad/L05/tools
      - tests/regression/quad/L06/tools
      - tests/regression/quad/L11/tools
    gz_groups: [l2, l4, l5, l7, l11]
    why: "every card-based parameter set's generation depends on the whole tools/card/*.py glob (fw/params/CMakeLists.txt)"

  - paths:
      - tools/sim/hover.py
      - tools/sim/prim_constants.py
      - tools/sim/reference.py
      - tools/sim/t4_rule.py
    ctest_labels: [L00, L01, L02, L03, L04, L05, L06, L07, L08, L09, L11]
    run_ci_steps: ["@card_gates"]
    pytest_paths:
      - tests/regression/quad/L01/tools
      - tests/regression/quad/L03/tools
