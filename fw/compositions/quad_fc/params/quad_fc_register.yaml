# quad_fc composition (fw/compositions/quad_fc) parameters: the motor-test limits (P11), the pad map (P10), the rates curve,
# arming and failsafe, the channel map, the estimator and the angle switch; the entries append after the product ids
# (marv_add_card_param_set EXTRA_REGISTER).
#
# motor_pad (M1 P10, the FC3v2 board's wiring): the pad of each logical motor, a permutation of the board outputs
# OUT0 .. OUT3 (GPIO 6 .. 9, boards/madflight_fc3v2_revc.h). Applied once, at motor output start-up (hal_target); the
# start-up refuses a table that is not a permutation. A motor's direction is set in the ESC, never inverted in firmware.

motor_pad:
  {type: i32, value: [3, 0, 1, 2], shape: motors, unit: "1", method: scenario, source: "Measured 2026-10-16 on the bench (M1 P11 console motor test, props off, DShot 100, Luis observing; tests/regression/quad/L09/results/m1-bench-card.md): with the identity map OUT0 drove rear left (CCW), OUT1 front left (CW), OUT2 rear right (CW), OUT3 front right (CCW), so logical 1 (front right) is OUT3, 2 (rear left) OUT0, 3 (front left) OUT1, 4 (rear right) OUT2; every spin direction already matched quad-X", sigma: choice}

# The console motor test (M1 P11, decision 0038): the limits of the quad_fc gate's motor-test branch. Safety numbers: the
# values Luis ruled on 2026-10-16 (answers "1. 500 2. 3 seconds 3. yes"; the duration raised to 20 s at the bench, "20s is
# good."), never others. The gate refuses a request
# outside them (stays all-stop, counts a refusal).
motor_test_dshot_max:
  {type: i32, value: 500, unit: "1", method: scenario, source: "Luis 2026-10-16: the motor-test DShot cap is 500 (answer '1. 500' to the P11 questions); a request above it is refused; decision 0038", sigma: choice}
motor_test_duration_max_ms:
  {type: i32, value: 20000, unit: "ms", method: scenario, source: "Luis 2026-10-16 at the M1 bench: the maximum duration of one motor-test command is 20 s ('20s is good.', raised from his earlier '2. 3 seconds' so a stop check is clearly distinguishable from the deadline); a longer request is refused; decision 0038 amendment", sigma: choice}

# The QF-1 rates curve (quad spec 4.0 M2 P2, fw/stick_rates): centre sensitivity and expo per axis, pilot preference. The
# maximum rate is the product ids rate_max_{roll,pitch,yaw} (decision 0005), not repeated here. Betaflight 4.5's defaults:
# Actual rates (rates_type), rcRates 7 (centre sensitivity 7 x 10 = 70 deg/s) and rcExpo 0.
rates_centre_roll:
  {type: f32, value: 1.2217304763960306, unit: "rad/s", method: scenario, source: "QF-1 centre roll sensitivity, pilot preference: 70 deg/s x pi/180 = 1.2217304763960306 rad/s (BIPM SI Brochure 9th ed. Table 8: 1 deg = (pi/180) rad; degrees appear only in this text, core 3). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7 per axis) and src/main/fc/rc.c:209-217, where the centre sensitivity is rcRates x 10 deg/s; the same default as rate_max_roll (decision 0005)", sigma: choice}
rates_centre_pitch:
  {type: f32, value: 1.2217304763960306, unit: "rad/s", method: scenario, source: "QF-1 centre pitch sensitivity, pilot preference: 70 deg/s x pi/180 = 1.2217304763960306 rad/s (BIPM SI Brochure 9th ed. Table 8: 1 deg = (pi/180) rad; degrees appear only in this text, core 3). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7 per axis) and src/main/fc/rc.c:209-217, where the centre sensitivity is rcRates x 10 deg/s; the same default as rate_max_pitch (decision 0005)", sigma: choice}
rates_centre_yaw:
  {type: f32, value: 1.2217304763960306, unit: "rad/s", method: scenario, source: "QF-1 centre yaw sensitivity, pilot preference: 70 deg/s x pi/180 = 1.2217304763960306 rad/s (BIPM SI Brochure 9th ed. Table 8: 1 deg = (pi/180) rad; degrees appear only in this text, core 3). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7 per axis) and src/main/fc/rc.c:209-217, where the centre sensitivity is rcRates x 10 deg/s; the same default as rate_max_yaw (decision 0005)", sigma: choice}
rates_expo_roll:
  {type: f32, value: 0.0, unit: "1", method: scenario, source: "QF-1 roll expo, pilot preference, a fraction in [0, 1] (Betaflight stores a percentage: rcExpo / 100). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (rcExpo 0 per axis); the curve, src/main/fc/rc.c:209-217, is written as mathematics in fw/stick_rates/include/marv/stick_rates/stick_rates.hpp", sigma: choice}
rates_expo_pitch:
  {type: f32, value: 0.0, unit: "1", method: scenario, source: "QF-1 pitch expo, pilot preference, a fraction in [0, 1] (Betaflight stores a percentage: rcExpo / 100). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (rcExpo 0 per axis); the curve, src/main/fc/rc.c:209-217, is written as mathematics in fw/stick_rates/include/marv/stick_rates/stick_rates.hpp", sigma: choice}
rates_expo_yaw:
  {type: f32, value: 0.0, unit: "1", method: scenario, source: "QF-1 yaw expo, pilot preference, a fraction in [0, 1] (Betaflight stores a percentage: rcExpo / 100). Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2: src/main/fc/controlrate_profile.c:48-57 (rcExpo 0 per axis); the curve, src/main/fc/rc.c:209-217, is written as mathematics in fw/stick_rates/include/marv/stick_rates/stick_rates.hpp", sigma: choice}

# The link-loss failsafe and arming (M2 P1, decisions 0040 and 0041): the state machine of fw/arming. Safety numbers: exactly
# these values, never others. The four times follow Betaflight 4.5.1 as read in decision 0041.
failsafe_loss_us:
  {type: i32, value: 100000, unit: "us", method: scenario, source: "Betaflight 4.5.1 src/main/rx/rx.c:136,506 (link lost after 100 ms without a valid frame); Luis 2026-10-16 '1. yes 2. yes' (decision 0041)", sigma: choice}
failsafe_hold_us:
  {type: i32, value: 300000, unit: "us", method: scenario, source: "Betaflight 4.5.1 src/main/rx/rx.c:131 MAX_INVALID_PULSE_TIME_MS 300 and rx.c:732-741 (last sticks held until 300 ms after the last valid frame, then sticks centred and minimum throttle); Luis 2026-10-16 '1. yes 2. yes' (decision 0041)", sigma: choice}
failsafe_disarm_us:
  {type: i32, value: 1500000, unit: "us", method: scenario, source: "Betaflight 4.5.1 src/main/flight/failsafe.c:74 failsafe_delay 15 (1.5 s), :77 failsafe_procedure Drop, :214-216 and :389-390 (link down at 1.5 s, disarm); Luis 2026-10-16 '1. yes 2. yes' (decision 0041)", sigma: choice}
failsafe_recovery_us:
  {type: i32, value: 500000, unit: "us", method: scenario, source: "Betaflight 4.5.1 src/main/flight/failsafe.c:68 failsafe_recovery_delay 5 (0.5 s): after a failsafe disarm, and at boot, arming needs 0.5 s of continuously valid link and the arm switch cycled off and on; Luis 2026-10-16 '1. yes 2. yes' (decision 0041)", sigma: choice}
arm_switch_threshold:
  {type: f32, value: 0.390625, unit: "1", method: scenario, source: "Derived: arm at or above 1700 us, normalized (1700 us - 1500 us) / 512 us = 0.390625, under the receive contract aux x = (us - 1500) / 512 and throttle = (us - 988) / 1024, whose endpoints and centre are the CRSF channel values 172 -> 988 us, 992 -> 1500 us, 1811 -> 2012 us (TBS CRSF spec, RC channels). Luis 2026-10-16 gave channel 5 at +100 armed and -100 disarmed and did not object to arming above 1700 us (the lead's recommendation)", sigma: choice}
arm_throttle_min:
  {type: f32, value: 0.060546875, unit: "1", method: scenario, source: "Derived: arming needs the throttle below 1050 us, normalized (1050 us - 988 us) / 1024 us = 0.060546875, under the receive contract throttle = (us - 988) / 1024 (CRSF 172 -> 988 us, 1811 -> 2012 us, TBS CRSF spec, RC channels). 1050 us is Betaflight's min_check default; Luis 2026-10-16: 'throttle at minimum is fine with the betaflight defaults'", sigma: choice}
airmode_activate_throttle:
  {type: f32, value: 0.29296875, unit: "1", method: scenario, source: "Derived: Betaflight 4.5.1 latches airmode once throttlePercent >= airModeActivateThreshold = 25 (src/main/pg/rx.c:103, CLI airmode_start_throttle_percent, src/main/cli/settings.c:786; src/main/fc/core.c:776-783, airmode enabled by default: src/main/config/feature.c:35 FEATURE_AIRMODE). throttlePercent is calculateThrottlePercentAbs() = abs of calculateThrottlePercent() (core.c:715-744) = constrain(((rcData[THROTTLE] - mincheck) * 100) / (PWM_RANGE_MAX - mincheck), 0, 100) in integer arithmetic, mincheck 1050 (pg/rx.c:91), PWM_RANGE_MAX 2000 (src/main/rx/rx.h:33). For whole microseconds x = us - 1050, x * 100 / 950 >= 25 first holds at x = 238 (x = 237: 23700 / 950 = 24), so at 1288 us. Normalized (1288 us - 988 us) / 1024 us = 300 / 1024 = 0.29296875 under the receive contract throttle = (us - 988) / 1024 (CRSF 172 -> 988 us, 1811 -> 2012 us, TBS CRSF spec, RC channels). Note the 25 percent is of Betaflight's span from min_check to 2000 us, not of this contract's full stick. Luis 2026-10-17: 'Implement b' (the default airmode latch), decision 0050", sigma: choice}

# The receiver channel map (M2 P5b, fw/hal/target/decode rc_input): the 1-based CRSF channel number (channel_01 = 1) that
# carries each control. AETR order: Luis's RadioMaster Pocket on ExpressLRS, 2026-10-16 (throttle is channel 3, the arm
# switch channel 5). Read once, at receiver start-up (hal_target); the start-up refuses a number outside 1 .. 16. Stick
# signs are fixed in rc_input.hpp (INFERRED from the EdgeTX / Betaflight convention; checked on the bench per stick).
rc_channel_roll:
  {type: i32, value: 1, unit: "1", method: scenario, source: "Luis 2026-10-16: the RadioMaster Pocket on ExpressLRS sends AETR, so roll is channel 1 (aileron)", sigma: choice}
rc_channel_pitch:
  {type: i32, value: 2, unit: "1", method: scenario, source: "Luis 2026-10-16: the RadioMaster Pocket on ExpressLRS sends AETR, so pitch is channel 2 (elevator)", sigma: choice}
rc_channel_throttle:
  {type: i32, value: 3, unit: "1", method: scenario, source: "Luis 2026-10-16: the RadioMaster Pocket on ExpressLRS sends AETR, so throttle is channel 3", sigma: choice}
rc_channel_yaw:
  {type: i32, value: 4, unit: "1", method: scenario, source: "Luis 2026-10-16: the RadioMaster Pocket on ExpressLRS sends AETR, so yaw is channel 4 (rudder)", sigma: choice}

# The arm switch channel (M2 P4): the 1-based RC channel whose value the arming machine reads (arm_switch_threshold above
# is its threshold). ManualControl.channels[rc_channel_arm - 1]; init panics outside 1..16 (the CRSF channel count).
rc_channel_arm:
  {type: i32, value: 5, unit: "1", method: scenario, source: "Luis 2026-10-16: 'arm switch : ch 5 at 100 is armed ch5 at -100 is disarmed'", sigma: choice}

# The angle mode switch (M4 A2, decision 0043 item 3): the 1-based RC channel whose value selects angle mode over acro, 0 = no
# switch (acro always). Angle iff ManualControl.channels[rc_channel_angle - 1] >= angle_switch_threshold (a value that is not a
# number is acro); init panics outside 0..16 and on the arm channel or a stick channel.
rc_channel_angle:
  {type: i32, value: 8, unit: "1", method: scenario, source: "Luis 2026-10-17: 'ch8 is another 2 mode switch with same values as ch5' (-100 / 100 on the RadioMaster Pocket); angle at 100, acro at -100, the same sense as the arm switch; decision 0048. Before: 0 (no switch, Betaflight 4.5.1's empty mode ranges, decision 0043 item 3)", sigma: choice}
angle_switch_threshold:
  {type: f32, value: 0.390625, unit: "1", method: scenario, source: "The same comparison rule as the arm switch (arm_switch_threshold above): angle at or above 1700 us, normalized (1700 us - 1500 us) / 512 us = 0.390625, under the receive contract aux x = (us - 1500) / 512 (CRSF 172 -> 988 us, 992 -> 1500 us, 1811 -> 2012 us, TBS CRSF spec, RC channels); decision 0043 item 3; Luis 2026-10-17 accepted the recommended threshold (decision 0048)", sigma: choice}

# The attitude estimator (M3 P2, decision 0042, fw/estimator): the Mahony filter's gains and the healthy-sample window that
# gates its initialisation (and with it the estimate's validity and arming). Betaflight 4.5.1
# (github.com/betaflight/betaflight, tag 4.5.1, read 2026-10-16); INFERRED until a committed test shows them suit this filter.
estimator_kp:
  {type: f32, value: 0.25, unit: "1/s", method: scenario, source: "Betaflight 4.5.1 src/main/flight/imu.c:125 .imu_dcm_kp = 2500 and :176 imuDcmKp = imu_dcm_kp / 10000.0f, so Kp = 2500 / 10000 = 0.25 1/s (the line-175 comment: 'our normal or baseline value for imuDcmKp is 0.25'); Betaflight's gain schedule (100x / 10x while disarmed) is not implemented; INFERRED from a source read, decision 0042", sigma: choice}
estimator_ki:
  {type: f32, value: 0.0, unit: "1/s2", method: scenario, source: "Betaflight 4.5.1 src/main/flight/imu.c:126 .imu_dcm_ki = 0 and :177 imuDcmKi = imu_dcm_ki / 10000.0f, so Ki = 0 1/s^2 (no gyro-bias estimate); INFERRED from a source read, decision 0042", sigma: choice}
estimator_accel_healthy_min:
  {type: f32, value: 0.9, unit: "1", method: scenario, source: "Betaflight 4.5.1 src/main/flight/imu.c:326-338 imuIsAccelerometerHealthy(): 'Accept accel readings only in range 0.9g - 1.1g', 0.81f < |f|^2 < 1.21f with |f| in g; the lower bound of the open interval, in g (g = kStandardGravity); INFERRED from a source read, decision 0042", sigma: choice}
estimator_accel_healthy_max:
  {type: f32, value: 1.1, unit: "1", method: scenario, source: "Betaflight 4.5.1 src/main/flight/imu.c:326-338 imuIsAccelerometerHealthy(): 'Accept accel readings only in range 0.9g - 1.1g', 0.81f < |f|^2 < 1.21f with |f| in g; the upper bound of the open interval, in g (g = kStandardGravity); INFERRED from a source read, decision 0042", sigma: choice}

# The boot gyro calibration and the upright check (M3 P6, decision 0042 approval, Luis 2026-10-16 "Yes" to both): fw/estimator
# gyro_cal.hpp, and the arming machine's Calibrating and NotUpright refusals. Betaflight 4.5.1 (github.com/betaflight/betaflight,
# tag 4.5.1, read 2026-10-16); INFERRED from a source read until a committed test shows them suit this board.
gyro_cal_duration_us:
  {type: i32, value: 1250000, unit: "us", method: scenario, source: "Betaflight 4.5.1 src/main/sensors/gyro.c:107 gyroCalibrationDuration = 125 ('// 1.25 seconds'), in 1/100 s (gyro.h:190 'Gyro calibration duration in 1/100 second'), used as duration x 10000 / sampleLooptime(us) cycles (gyro.c:164-167): 125 x 10000 us = 1250000 us. Betaflight counts cycles; here the window is the span of the stamps. INFERRED from a source read, decision 0042", sigma: choice}
gyro_cal_movement_max:
  {type: f32, value: 0.058643062867009474, unit: "rad/s", method: scenario, source: "Derived: Betaflight 4.5.1 src/main/sensors/gyro.c:108 gyroMovementCalibrationThreshold = 48 (gyro.h:168), compared at gyro.c:234 with the standard deviation (devStandardDeviation, maths.c:161-164, sample n - 1) of the RAW gyro readings gyroADCRaw of each axis over the window (gyro.c:220-224), i.e. 48 LSB of the sensor. The board's gyro is the LSM6DSV at +-2000 dps, G_So 70 mdps/LSB (boards/parts/lsm6dsv.hpp:89, datasheet 4.1 Table 3): 48 LSB x 0.07 dps/LSB = 3.36 dps x pi/180 = 0.058643062867009474 rad/s (BIPM SI Brochure 9th ed. Table 8: 1 deg = (pi/180) rad; degrees appear only in this text, core 3). On Betaflight's own ICM-426xx at +-2000 dps (GYRO_SCALE_2000DPS 2000 / 2^15 dps/LSB, accgyro.h:40) the same 48 LSB is 2.93 dps = 0.0511 rad/s. INFERRED from a source read, decision 0042", sigma: choice}
arm_small_angle:
  {type: f32, value: 0.4363323129985824, unit: "rad", method: scenario, source: "Betaflight 4.5.1 src/main/flight/imu.c:119-121 DEFAULT_SMALL_ANGLE 25 (180 only with USE_RACE_PRO), :127 .small_angle = DEFAULT_SMALL_ANGLE, :183 smallAngleCosZ = cos(degreesToRadians(small_angle)), :856-859 isUpright() = attitudeIsEstablished && getCosTiltAngle() > smallAngleCosZ (getCosTiltAngle = rMat[2][2], :752-755), src/main/fc/core.c:320-324 (not upright: ARMING_DISABLED_ANGLE): 25 deg x pi/180 = 0.4363323129985824 rad (BIPM SI Brochure 9th ed. Table 8: 1 deg = (pi/180) rad; degrees appear only in this text, core 3). Arming is refused above it; Luis 2026-10-16 'Yes' (decision 0042). INFERRED from a source read", sigma: choice}
