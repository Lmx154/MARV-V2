# Rate-loop spacing tolerance of the FC3v2 target set (marv_params_fc3v2), in params_gen input form
# (tools/gen/params_gen.py), passed after the design-budget register so the id is the product set's
# (design/rate_timing_register.yaml; fw/params/CMakeLists.txt, EXTRA_REGISTER; decision 0034).

rate_period_tolerance_us:
  {type: i32, value: 3, unit: "us", method: scenario, source: "Derived, rounded up to whole us because a false refusal zeroes the torque (Luis, 2026-10-16, '4. yes' and '1. yes', decisions 0034 and 0014 Amendment): ceil(T_rate odr_error + 2 delta + 1 us) = ceil(266.66 us x 510e-6 + 2 x 0.76 us + 1 us) = ceil(0.14 + 1.52 + 1) = 3 us. T_rate = rate_loop_divisor x tick_period_num_us / tick_period_den = 3906250/14649 us (fc3v2_scenario_values.yaml, this part's trim period, DS13476 9.49). odr_error = 510 ppm, the measured residual of the interrupt-entry spacing against that period (sensors/profiles/madflight_fc3v2_revc.yaml, odr_error; tests/regression/quad/L09/results/p12_bench/report.txt:21, :44, :67, :90). delta = 0.76 us, the largest stamp-entry deviation from the mean with the image in SRAM (report.txt:67, :90, runs c and d; the stamp is read at interrupt entry, and a spacing is the difference of two). The 1 us is the whole-microsecond truncation of each stamp (decision 0034, the SIL's hal_sim bound). The rule's 2 den tol < num holds (2 x 14649 x 3 = 87894 < 1953125)", sigma: choice}
