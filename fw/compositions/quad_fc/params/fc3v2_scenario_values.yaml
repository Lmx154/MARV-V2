# FC3v2 target scenario-values register (quad spec 4.0 M1; used by the parameter set marv_params_fc3v2 only). The
# product register design/scenario_values.yaml (which the SIL goldens depend on), copied so that the target's tick
# period can differ from it; it differs in the tick period (this part's mean period from its ODR trim), in the rate-loop divisor's rationale text
# and in rate_ref_ff_enable (1 here, the reference feed-forward on; decision 0058).
# Same schema (tools/card/schema.py, lint.py --scenario).
# Betaflight citations are to tag 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2.

tick_period_num_us:
  value: 1953125
  unit: us
  method: scenario
  sigma: choice
  rationale: >-
    Numerator of the tick period, the mean tick period of this part, from its LSM6DSV ODR trim: T = 1e6 / (7680 Hz x (1 + 0.0013 f)) us =
    3906250 / (3 (10000 + 13 f)) us (ST DS13476 Rev 5 §9.49 Tables 136-138: ODR_actual = 7680 Hz x (1 + 0.0013 x
    FREQ_FINE) / ODRcoeff, ODRcoeff 1 at 7.68 kHz; the 7680 Hz tick is Luis's ruling of 2026-10-16, "6. yes"). f = FREQ_FINE
    = -18 as this board reads it at start-up (console "FREQ_FINE -18 (ODR 7500.3 Hz by DS13476 9.49)",
    tests/regression/quad/L09/results/p12_bench/report.txt:6): T = 3906250 / 29298 = 1953125 / 14649 us = 133.33 us
    (7500.3 Hz), the fraction reduced by gcd 2. Luis, 2026-10-16, "1. yes" (decision 0014, Amendment 2026-10-16): the
    rate loop's design is checked at this mean period (marv_params_fc3v2's RATE_GUARD mean_period, fw/params/CMakeLists.txt), and imu_start refuses to run on a part whose
    trim gives another period (fw/hal/target/src/lsm6dsv.cpp), because the design would then have been checked at the
    wrong period. The INFERRED figure is the datasheet's rule; the measured mean spacing is 133.396 us
    (tests/regression/quad/L09/results/p12_bench/report.txt:67), 0.05 % above T.
  used_by: [rate-loop gain design, rate-loop period check]

