# FC3v2 target scenario-values register (quad spec 4.0 M1; used by the parameter set marv_params_fc3v2 only). The
# product register design/scenario_values.yaml (which the SIL goldens depend on), copied so that the target's tick
# period can differ from it; at present it differs only in the rationale text (the tick period is a PLACEHOLDER).
# Same schema (tools/card/schema.py, lint.py --scenario).
# Betaflight citations are to tag 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2.

tick_period_num_us:
  value: 625
  unit: us
  method: scenario
  sigma: choice
  rationale: >-
    Numerator of the tick period. PLACEHOLDER: the SIL tick, 625/4 us = 156.25 us (6.4 kHz), until the target tick is
    admitted. The target tick is the LSM6DSV gyro ODR 7.68 kHz, period 3125/24 us (Luis, 2026-10-16, "6. yes"; the ODR
    is INFERRED from ST DS13476 until the sensor-profile packet M1 P8). It is refused at build time by
    tools/card/rate_lead.py:919 (the rate executions' stamp pattern is 12 long, the guard's periodic analysis covers 1
    or 2); it replaces this value when the timing rule (M1 P7) resolves that. Nothing ticks on the target until then.
  used_by: [rate-loop gain design, rate-loop period check]

tick_period_den:
  value: 4
  unit: "1"
  method: scenario
  sigma: choice
  rationale: >-
    Denominator of the tick period. PLACEHOLDER: the SIL tick, 625/4 us = 156.25 us (6.4 kHz), until the target tick is
    admitted. The target tick is the LSM6DSV gyro ODR 7.68 kHz, period 3125/24 us (Luis, 2026-10-16, "6. yes"; the ODR
    is INFERRED from ST DS13476 until the sensor-profile packet M1 P8). It is refused at build time by
    tools/card/rate_lead.py:919 (the rate executions' stamp pattern is 12 long, the guard's periodic analysis covers 1
    or 2); it replaces this value when the timing rule (M1 P7) resolves that. Nothing ticks on the target until then.
  used_by: [rate-loop gain design, rate-loop period check]

rate_loop_divisor:
  value: 2
  unit: "1"
  method: scenario
  sigma: choice
  rationale: >-
    Integer division of the tick that gives the rate-loop rate. Luis, 2026-10-16 ("6. yes": tick 7.68 kHz with rate
    divisor 2), the same divisor as the product register (design/scenario_values.yaml, decision 0005). The rate is
    3.2 kHz at the PLACEHOLDER tick above, 3.84 kHz at the target tick 3125/24 us.
  used_by: [QF-8, rate-loop gain design, rate group]

rate_max_roll:
  value: 11.693705988362009
  unit: rad/s
  method: scenario
  sigma: choice
  rationale: >-
    QF-1 maximum roll rate, pilot preference: 670 deg/s x pi/180 = 11.693705988362009 rad/s (degrees appear only in
    user-facing text, core 3). Luis, 2026-09-30 (decision 0005): Betaflight's default. Betaflight src/main/fc/
    controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7, rcExpo 0, rates 67 per axis); src/main/fc/rc.c:209-219
    applyActualRates gives rates x 10 = 670 deg/s at full stick with zero expo; the rate_limit cap of 1998 deg/s
    (src/main/fc/rc_controls.h:80, applied at rc.c:663) does not bind.
  used_by: [QF-1, QF-2]

rate_max_pitch:
  value: 11.693705988362009
  unit: rad/s
  method: scenario
  sigma: choice
  rationale: >-
    QF-1 maximum pitch rate, pilot preference: 670 deg/s x pi/180 = 11.693705988362009 rad/s (degrees appear only in
    user-facing text, core 3). Luis, 2026-09-30 (decision 0005): Betaflight's default. Betaflight src/main/fc/
    controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7, rcExpo 0, rates 67 per axis); src/main/fc/rc.c:209-219
    applyActualRates gives rates x 10 = 670 deg/s at full stick with zero expo; the rate_limit cap of 1998 deg/s
    (src/main/fc/rc_controls.h:80, applied at rc.c:663) does not bind.
  used_by: [QF-1, QF-2]

rate_max_yaw:
  value: 11.693705988362009
  unit: rad/s
  method: scenario
  sigma: choice
  rationale: >-
    QF-1 maximum yaw rate, pilot preference: 670 deg/s x pi/180 = 11.693705988362009 rad/s (degrees appear only in
    user-facing text, core 3). Luis, 2026-09-30 (decision 0005): Betaflight's default. Betaflight src/main/fc/
    controlrate_profile.c:48-57 (RATES_TYPE_ACTUAL, rcRates 7, rcExpo 0, rates 67 per axis); src/main/fc/rc.c:209-219
    applyActualRates gives rates x 10 = 670 deg/s at full stick with zero expo; the rate_limit cap of 1998 deg/s
    (src/main/fc/rc_controls.h:80, applied at rc.c:663) does not bind.
  used_by: [QF-1, QF-2]

angle_tilt_max:
  value: 1.0471975511965976
  unit: rad
  method: scenario
  sigma: choice
  rationale: >-
    Angle-mode maximum tilt, pilot preference: 60 deg x pi/180 = 1.0471975511965976 rad (degrees appear only in
    user-facing text, core 3). Luis, 2026-09-30 (decision 0006, owner decision 6): a scenario value cited from
    Betaflight at a pinned commit. Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2:
    src/main/flight/pid.c:138 `.angle_limit = 60` (the default, in degrees); src/main/cli/settings.c:1169
    (configurable from 10 to 85). The geometry differs from Betaflight's, which limits each Euler angle (pid.c:395):
    MARV bounds the total tilt (decision 0006 D).
  used_by: [angle mode]

yaw_deadband:
  value: 0.0
  unit: "1"
  method: scenario
  sigma: choice
  rationale: >-
    Angle-mode yaw-stick deadband as a fraction of full stick: 0/500 = 0. It is written 0.0 so that it is an f32
    parameter (an integer value is an i32 parameter). Luis, 2026-09-30 (decision 0006, owner decision 14): a scenario
    value cited from Betaflight at a pinned commit. Betaflight 4.5.2, commit 024f8e13d4e642eb6a380308685b9ea3aa3ef1a2:
    src/main/fc/rc_controls.c:79 `.yaw_deadband = 0` (the default, in rc units of the 500-unit half range);
    src/main/cli/settings.c:1084 (range 0 to 100); applied at src/main/fc/rc.c:700-701 (subtracted) and rc.c:778
    (divider 500 - yaw_deadband). The heading lock engages only at exactly zero stick; with real sticks at L8 this
    value needs revisiting. The attitude generator refuses a value outside [0, 1).
  used_by: [angle mode, attitude generator input check]

rate_ff_enable:
  value: 0
  unit: "1"
  method: scenario
  sigma: choice
  rationale: >-
    Switch of the rate loop's lag-compensated omega x J omega feed-forward: 1 = on (fw/rate RateConfig takes J from
    inertia_xx/yy/zz, tau_m from motor_tau and T_ff from rate_ff_filter_tau), any other value = off (all three 0, the
    exact PID law). 0: inert until stage (e) switches it on in the same change that creates
    tests/regression/quad/L06/XFAIL_GATE_CLOSED (decision 0014, owner decision 2: "FF goes live at stage (e), with the
    gate file"). Stage (c)'s FF-on evidence switches it through the test harness (sil_override), not here.
  used_by: [rate loop feed-forward]

site_latitude_rad:
  value: 0.82
  unit: rad
  method: scenario
  sigma: choice
  rationale: >-
    Geodetic latitude of the design site (the NED origin), the site at which the L11 vertical-loop generator evaluates
    the hover thrust m g(phi, h0) and the gravity height gradient (decision 0020). The value the committed scenario files
    carry (scenarios/quad/L02/hover.yaml: a mid-latitude site off the equator and the poles, so the latitude term of g is
    exercised; the same value as the L1 fixture, tests/regression/quad/L01/unit/plant_card/hover_card_test.cpp,
    kScenarioLat).
  used_by: [L11 vertical-loop gain design, hover thrust]

site_height_m:
  value: 500.0
  unit: m
  method: scenario
  sigma: choice
  rationale: >-
    Height h0 of the design site (the NED origin) above the WGS 84 ellipsoid, the site at which the L11 vertical-loop
    generator evaluates the hover thrust m g(phi, h0) and the gravity height gradient (decision 0020). The value the
    committed scenario files carry (scenarios/quad/L02/hover.yaml: the same height as the L1 fixture,
    tests/regression/quad/L01/unit/plant_card/hover_card_test.cpp, kScenarioHeight; a plausible flying-site height,
    not vehicle data).
  used_by: [L11 vertical-loop gain design, hover thrust]
