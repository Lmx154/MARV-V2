# L4 rate-scripted composition (fw/compositions/l4_rate_scripted) scenario parameters: the collective thrust request, a
# piecewise-constant body-rate setpoint script (capacity 8 segments, fixed by the entries below) and one torque chirp.
# Every entry is method scenario, sigma choice (core 2.1): set per run by the scenario through sil_override; the
# default is the neutral value (no thrust, no segments, no chirp). None is a vehicle number.

l4_thrust_n:
  {type: f32, value: 0.0, unit: "N", method: scenario, source: "l4_rate_scripted default: the neutral value, set per run by the scenario through sil_override (fw/compositions/l4_rate_scripted/params/l4_rate_scripted_register.yaml)", sigma: choice}
l4_seg_count:
  {type: i32, value: 0, unit: "1", method: scenario, source: "l4_rate_scripted default: the neutral value, set per run by the scenario through sil_override (fw/compositions/l4_rate_scripted/params/l4_rate_scripted_register.yaml)", sigma: choice}
