name: ci

# The merge gate (core 7.6): the full suite runs only on the merge into master, a pull request into master or a push to
# master, and on demand (workflow_dispatch). Development is checked by ci/dev_check.sh (the smoke test plus the
# blast-radius selection), not here. Every run is MARV_CI_MODE=full. No schedule: a nightly run would re-test an
# unchanged master (Luis, 2026-10-14).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  MARV_CI_MODE: full

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runner resources
        run: |
          nproc
          free -b
          head -3 /proc/meminfo
      - name: Build CI image
        run: docker build -t marv-ci -f ci/Dockerfile .
      - name: Run CI
        env:
          # Pull request: check against the target branch. Push: check the whole pushed range (the commit before the
          # push), except when the push creates the branch (before is all zeros). Schedule and dispatch: empty, no check.
          MARV_CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: docker run --rm -e MARV_CI_BASE_REF -e MARV_CI_MODE -v "$PWD":/src -w /src marv-ci ci/run_ci.sh

  gz-l2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: |
          nproc
          free -b
          head -3 /proc/meminfo
      - name: Build CI image
        run: docker build -t marv-ci -f ci/Dockerfile .
      - name: Build Gazebo CI image
        run: docker build -t marv-ci-gz -f ci/Dockerfile.gz .
      - name: Run Gazebo CI (group l2)
        run: docker run --rm -e MARV_CI_MODE -v "$PWD":/src -w /src marv-ci-gz ci/run_ci_gz.sh l2

