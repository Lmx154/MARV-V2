name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Build CI image
        run: docker build -t marv-ci -f ci/Dockerfile .
      - name: Run CI
        env:
          MARV_CI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: docker run --rm -e MARV_CI_BASE_REF -v "$PWD":/src -w /src marv-ci ci/run_ci.sh
