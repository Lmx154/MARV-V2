# Quad L4 scenario 'step_yaw' (docs/spec/10-quad-flight-software.md section 4 L4, T4; docs/decisions/0005 "T4").
# A yaw-rate step of rate_max_yaw from hover, flown by the l4_rate_scripted composition on truth gyro: a truth-fed,
# perfect-model run, not a validation run (core section 6). Schema and checks: tools/sim/l4_scenario.py; the runner
# (tools/sim/run_l4.py) derives the step execution, the window, the duration and the hover thrust from the build.
# Every number is a labelled scenario value or a derived value. Frames NED / FRD, SI units.
scenario: step_yaw
site_latitude_rad:
  value: 0.82
  unit: rad
  label: scenario
  rationale: "the L2 hover site (scenarios/quad/L02/hover.yaml): mid-latitude, so the latitude term of g is exercised"
site_height_m:
  value: 500.0
  unit: m
  label: scenario
  rationale: "the L2 hover site height (scenarios/quad/L02/hover.yaml); a plausible flying site height, not vehicle data"
seed:
  value: 1
  unit: "1"
  label: scenario
  rationale: "RESERVED at v0: marv_plant v0 and the composition draw no random numbers, so the value has no effect; it completes the run identity (firmware, card, scenario, seed)"
tick_period_num_us:
  value: 625
  unit: us
  label: derived
  rule: "design/scenario_values.yaml tick_period_num_us; the rate loop checks each execution's spacing against the period built from it, so the runner refuses a world tick that differs from the build's"
tick_period_den:
  value: 4
  unit: "1"
  label: derived
  rule: "design/scenario_values.yaml tick_period_den, as tick_period_num_us"
m_sequence:
  value: [2, 1]
  unit: "1"
  label: derived
  rule: "decision 0005 'T4 envelope widening': E_i = |y(m=1) - y(m=2)|, the last halving of docs/decisions/0003 item 9; both divide rate_loop_divisor, so every execution reads the state at its own tick"
initial_state:
  position_ned_m:
    value: [0.0, 0.0, 0.0]
    unit: m
    label: scenario
    rationale: "the NED origin, the site itself; the generated world has no ground and no contact"
  attitude_q_wxyz:
    value: [1.0, 0.0, 0.0, 0.0]
    unit: "1"
    label: scenario
    rationale: "level, the identity quaternion (canonical sign w >= 0)"
  velocity_ned_m_s:
    value: [1.0, 0.0, 0.0]
    unit: m/s
    label: scenario
    rationale: "every host step (at least one tick, 156.25 us) moves the link 1.5625e-4 m north, 156 times the 1e-6 pose change below which gz-sim 8 leaves a read stale (docs/decisions/0003 item 11), so every read is fresh (INFERRED; fresh_steps / stale_report show it per run and the test fails on a stale read in the window); marv_plant v0 has no drag or position-dependent torque and g depends on height only, so the translation does not act on the rotation"
  body_rates_frd_rad_s:
    value: [0.0, 0.0, 0.0]
    unit: rad/s
    label: scenario
    rationale: "starts at rest: the design-model step response starts from the zero state"
step:
  axis:
    value: yaw
    unit: "1"
    label: scenario
    rationale: "one axis per scenario: quad spec 4 L4 T4, per-axis steps"
  rate_rad_s:
    value: 11.693705988362009
    unit: rad/s
    label: derived
    rule: "design/scenario_values.yaml rate_max_yaw (QF-1 maximum rate, decision 0005 owner decision 6), the T3 golden's setpoint; the other two axes are 0"
  settle_s:
    value: 1.0
    unit: s
    label: scenario
    rationale: "the motors spin up from rest (marv_plant motor state starts at 0 rad/s), and the step must start at the design model's operating point: 1 s is 30.3 motor time constants of the card's tau = 0.033 s, a rotor speed deficit of e^-30.3 = 7e-14 of hover speed; the pre-step gyro residual is inside the predicate, whose envelope is 0 at the window's first executions"
  horizon_tau_ref:
    value: 10
    unit: "1"
    label: derived
    rule: "the T3 horizon rule, ten reference time constants after the step (tests/regression/quad/L04/t3/README.md, rate_t3_oracle.py HORIZON_TAUS): the window is 1 + ceil(10 tau_ref / T) executions, tau_ref from the build"
