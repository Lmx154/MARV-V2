# Quad L5 scenario 'yaw_fallback' (docs/spec/10-quad-flight-software.md section 4 L5, T4; docs/decisions/0006 F T4 yaw-lock fallback).
# Level tilt, a sustained full yaw stick, then the release, flown by the l5_attitude_scripted composition (angle mode, the
# attitude law, the rate loop in bypass) on truth gyro and truth attitude: a truth-fed, perfect-model run, not a validation
# run (core section 6). The stick segments are in attitude executions counted from the origin execution (the T3 oracle's
# seed execution a = 0, tests/regression/quad/L05/t3/reference/attitude_t3_oracle.py); the origin itself is the first
# attitude execution at or after settle_s that keeps the stamp phase (tools/sim/run_l5.py). Schema and checks:
# tools/sim/l5_scenario.py. Every number is a labelled scenario value or a derived value. Frames NED / FRD, SI.
scenario: yaw_fallback
site_latitude_rad:
  value: 0.82
  unit: rad
  label: scenario
  rationale: "the L2 hover site (scenarios/quad/L02/hover.yaml): mid-latitude, so the latitude term of g is exercised"
site_height_m:
  value: 500.0
  unit: m
  label: scenario
  rationale: "the L2 hover site height (scenarios/quad/L02/hover.yaml); a plausible flying site height, not vehicle data"
seed:
  value: 1
  unit: "1"
  label: scenario
  rationale: "RESERVED at v0: marv_plant v0 and the composition draw no random numbers, so the value has no effect; it completes the run identity (firmware, card, scenario, seed)"
tick_period_num_us:
  value: 625
  unit: us
  label: derived
  rule: "design/scenario_values.yaml tick_period_num_us; the rate loop checks each execution's spacing against the period built from it, so the runner refuses a world tick that differs from the build's"
tick_period_den:
  value: 4
  unit: "1"
  label: derived
  rule: "design/scenario_values.yaml tick_period_den, as tick_period_num_us"
m_sequence:
  value: [2, 1]
  unit: "1"
  label: derived
  rule: "decision 0005 'T4 envelope widening' as at L4: E = |y(m=1) - y(m=2)|; both divide the attitude divisor (decision 0006 B, Runner), so every attitude sample is fresh"
initial_state:
  position_ned_m:
    value: [0.0, 0.0, 0.0]
    unit: m
    label: scenario
    rationale: "the NED origin, the site itself; the generated world has no ground and no contact"
  attitude_q_wxyz:
    value: [1.0, 0.0, 0.0, 0.0]
    unit: "1"
    label: scenario
    rationale: "level, the identity quaternion (canonical sign w >= 0)"
  velocity_ned_m_s:
    value: [1.0, 0.0, 0.0]
    unit: m/s
    label: scenario
    rationale: "every host step (at least one tick, 156.25 us) moves the link 1.5625e-4 m north, 156 times the 1e-6 pose change below which gz-sim 8 leaves a read stale (docs/decisions/0003 item 11), so every read is fresh (INFERRED; fresh_steps / stale_report show it per run and the test fails on a stale read in the window); marv_plant v0 has no drag or position-dependent torque and g depends on height only, so the translation does not act on the rotation"
  body_rates_frd_rad_s:
    value: [0.0, 0.0, 0.0]
    unit: rad/s
    label: scenario
    rationale: "starts at rest: the T3 envelope is the design-model response from level and at rest"
thrust:
  value: hover
  unit: "1"
  label: derived
  rule: "the collective request is the float32 of m g(phi, h0), the card's mass and tools/sim/hover.py normal_gravity (tools/sim/run_l4.py hover_thrust), as at L4"
script:
  settle_s:
    value: 1.0
    unit: s
    label: scenario
    rationale: "as L4 step_roll: the motors spin up from rest and the stick must start at the design model's operating point; 1 s is 30.3 motor time constants of the card's tau = 0.033 s, a rotor speed deficit of 7e-14 of hover speed"
  segments:
    - start_attitude_execution:
        value: 1
        unit: "1"
        label: derived
        rule: "the T3 oracle's a_s = 1: the stick is on from attitude execution 1, execution 0 (the origin) is its seed execution with sticks 0 (attitude_t3_oracle.py docstring)"
      stick:
        value: [0.0, 0.0, 1.0]
        unit: "1"
        label: derived
        rule: "stick_scale 1.0 of the yaw_fallback block of attitude_t3_envelope.txt (the T3 property min sigma_r omega > 0 up to the fallback holds at full stick, so the stick does not halve, decision 0006 F T4 yaw-lock fallback); positive s_yaw yaws nose right (l5_script.hpp); the other sticks are 0"
    - start_attitude_execution:
        value: 20293
        unit: "1"
        label: derived
        rule: "release_execution of yaw_fallback in tests/regression/quad/L05/t3/reference/attitude_t3_envelope.txt: a_r = 1 + H, H = 20292 attitude executions (segment_seconds 6.341210085512444 s, ten attitude time constants 1/att_kp doubled once until every envelope end value is below F)"
      stick:
        value: [0.0, 0.0, 0.0]
        unit: "1"
        label: scenario
        rationale: "the release, all sticks 0: angle mode enters braking (decision 0006 D) at this execution"
  disturbance:
    yaw_nm:
      value: 0.1634589284658432
      unit: N*m
      label: derived
      rule: "d = sigma_r tau_held,yaw with sigma_r = +1 (a positive yaw stick gives a positive yaw rate at the release): disturbance_nm of the yaw_fallback block of attitude_t3_envelope.txt, the collective-held yaw torque envelope of decision 0005's chirp rule (attitude_t3_inputs.txt tau_held_yaw_nm, f32); the test re-checks it against the recorded fixture"
    start_attitude_execution:
      value: 20293
      unit: "1"
      label: derived
      rule: "the release execution of the script (decision 0006 F T4 yaw-lock fallback: the disturbance is on from the release stamp, so the rate integrator has not absorbed it during the hold)"
  end_attitude_execution:
    value: 40584
    unit: "1"
    label: derived
    rule: "1 + 2 H of the recorded envelope (attitude_t3_envelope.txt channel omega of yaw_fallback, count 40585 executions 0..40584): the run ends with the envelope"
