# Vehicle card: Luis's 7-inch quad on the madflight FC3v2 Rev-C (quad spec §4.0 M1, M4; core contracts 2.1). Schema and
# sigma policy: tools/card/schema.py. Frames: FRD body, CM origin. Spin: ccw = counter-clockwise viewed from above.
# The file name says 5in for history (the first card of this board carried a 5-inch placeholder physics); the airframe is
# the 7-inch below. Noticed, not renamed (M4 P1 packet).
# Hardware (Luis, 2026-10-15/16/17): madflight FC3v2 Rev-C, Flywoo Goku G55M 55A AM32 4-in-1 ESC, motors Emax ECO II Series
# 2807-1700KV, props HQProp 7x3.5x3 polycarbonate (36 g for four), frame HGLRC MY7 7-inch (335 mm wheelbase, 217 g +- 5 g
# frame only, plates 2/3/3 mm, arms 6 mm), flight pack Ovonic 4S1P 1600 mAh 120C LiPo (172 g, "battery is mounted on top";
# 14.8 V nominal, 23.68 Wh, quad spec §4.0 M4). The card schema (tools/card/lint.py) has no pack field, so the pack is
# recorded in this comment only and no tool reads it.
# Physics (M4 P1): mass and motor x, y are Luis's measurements. Thrust coefficient, torque ratio, motor lag, inertia and
# the motors' z are sourced estimates (INFERRED, PLACEHOLDER) until the thrust stand and the bifilar pendulum (quad spec
# §4.0 M4) replace them. rotors.speed_range and rotors.esc_map are unchanged from M1 (Luis's ruling of 2026-10-16).
vehicle: marv_5in_fc3v2

mass:
  value: 0.732
  unit: kg
  method: measured
  source: "Luis, 2026-10-16/17: 'the drone is 696 grams', 'add 36 grams i forgot to add the prop weight', 'yes the 732 includes the battery' (696 g + 36 g of props = 732 g all-up: frame, motors, ESC, FC, wiring, pack and props)"
  sigma: UNKNOWN
  status: [UNVERIFIED, PLACEHOLDER]
  placeholder:
    reason: "Luis's sum of a weighed 696 g and 36 g of props added by hand; the scale, its resolution and a weighing of the flight-ready quad are not recorded"
    replaced_by: "a recorded weighing of the flight-ready quad (scale, resolution, pack and props on) before the first flight"
  check: "a recorded weighing of the flight-ready quad (scale, its resolution, the pack and the props on), or the thrust stand's hover thrust; the prop weight was added to the weighed 696 g by hand, not weighed with the props on"
  note: "the scale and its resolution are not recorded, so the sigma is UNKNOWN (an invented one is refused by the sigma policy). The part masses used by the inertia model: pack 172 g (Luis 'battery weight - 172 grams'), props 9 g each, motors 47.9 g each, frame 217 g +- 5 g (HGLRC MY7 frame only), ESC 15 g; the remainder 100.4 g is the stack, receiver, wiring and the rest"

inertia_diag:
  value: [0.00427, 0.00332, 0.00734]
  shape: diag3
  unit: kg m^2
  method: "derived(point-mass model vehicles/marv_5in_fc3v2_inertia_model.py: Ixx = sum m (y^2 + (h - h_cg)^2), Iyy = sum m (x^2 + (h - h_cg)^2), Izz = sum m (x^2 + y^2) about the model's own CG; masses and motor x, y as in the model, heights ASSUMED there)"
  source: "vehicles/marv_5in_fc3v2_inertia_model.py, run without arguments (nominal result: J = 4.2670e-03, 3.3214e-03, 7.3361e-03 kg m^2, CG 16.67 mm above the arm mid-plane); inputs: Luis's masses (this card's mass note) and ruler-measured motor spacing (rotors.m<n>.position); the split of the 217 g frame (50 % arms as point masses at their midpoints, 50 % plates at the centre) and every height above the arm plane are ASSUMED in the script, not measured"
  sigma: [0.00107, 0.00083, 0.00184]
  sigma_rule: "25 % of the value: the upper end of the 20-25 % bound set for a point-mass model of an unweighed airframe (lead, M4 P1 packet). The script's modelled variants account for 4.3-4.7 % (assumed split and heights, root-sum-square of one-at-a-time half-spreads) and a +-5 mm error of each motor coordinate for up to 9 % of Ixx, Iyy and Izz; the rest allows for the unmodelled parts (camera, VTX, antennas, wiring, the pack's exact place, the arms' and rotors' own inertias)"
  status: [INFERRED, PLACEHOLDER]
  placeholder:
    reason: "a point-mass estimate with assumed heights and frame split; the airframe has not been put on a pendulum"
    replaced_by: "the M4 bifilar pendulum measurement of the flight-ready quad (quad spec §4.0 M4)"
  note: "diagonal only: the products of inertia (the pack, camera and wiring are not exactly centred) are neglected. Roll inertia is the largest of the two tilt axes because the y span (255 mm) is wider than the x span (224 mm). Source frame FRD"

drag:
  value: [0.356, 0.214, 0.0]
  shape: diag3
  unit: kg/s
  method: "derived(D = m x d: the mass-normalized rotor-drag coefficients d_x, d_y that Faessler, Franchi and Scaramuzza identified on their own 610 g quadrotor with six-inch propellers, each averaged over the paper's three identification runs, times this card's mass 0.732 kg and rounded to three decimals; d_z = 0)"
  source: "Faessler, Franchi, Scaramuzza, 'Differential flatness of quadrotor dynamics subject to rotor drag for accurate tracking of high-speed trajectories', IEEE RA-L 3(2):620-626, 2018 (arXiv 1712.02402): model v_dot = -g z_W + c z_B - R D R^T v, eq. (2), with D = diag(d_x, d_y, d_z) 'formed by the mass-normalized rotor-drag coefficients' (unit 1/s); identified in Section VII-C (platform of Section VII-A: 610 g, six-inch propellers, thrust-to-weight 4): circle trajectory at 4 m/s d_x = 0.544, d_y = 0.386 1/s; Gerono lemniscate (max 4 m/s) d_x = 0.491, d_y = 0.236 1/s; circle at 2.8 m/s d_x = 0.425, d_y = 0.256 1/s. Means 0.4867 and 0.2927 1/s; times 0.732 kg = 0.3562 and 0.2142 kg/s. d_z: the paper sets d_z = 0 because 'a non zero drag coefficient in the z-direction d_z does not improve the trajectory tracking performance', also on vertical trajectories up to 2.5 m/s: that is not a measurement of d_z, so d_z = 0 here is a modelling choice and its sigma is UNKNOWN. The UZH NeuroBEM paper (Bauersfeld et al., RSS 2021, arXiv 2106.08015) gives no D (blade-element model plus a learned residual); no source gives D for a 7-inch, 732 g quad"
  sigma: [0.044, 0.055, UNKNOWN]
  sigma_rule: "d_x, d_y: half of the spread of the paper's three identifications, (max - min) / 2 = 0.0595 and 0.0750 1/s, times 0.732 kg. This covers the scatter between trajectories only, not the transfer from a 610 g six-inch quad (wider than long, carbon frame) to this 732 g seven-inch HGLRC MY7 frame, which is not quantified (the paper itself reports that the value depends on the trajectory and on thrust). d_z: UNKNOWN"
  status: [INFERRED, UNVERIFIED, PLACEHOLDER]
  placeholder:
    reason: "mass-normalized coefficients of another airframe (610 g, six-inch) multiplied by this airframe's mass; no drag measurement on this quad; the mass 0.732 kg is itself a placeholder; D is derived with it and must be re-derived when the mass is replaced; the transfer rule 'the mass-normalized coefficient carries over' is INFERRED (an assumption of similar thrust-to-weight and rotor-disc loading); d_z = 0 is a modelling choice"
    replaced_by: "a fit of D to logged flight data of this quad after first flight (velocity against the accelerometer-minus-attitude residual, as in Faessler section VII-C), or a wind-tunnel / towing measurement"
  check: "the post-first-flight fit above; until then the sim's tilt-versus-velocity behaviour is that of a quad with the Faessler et al. platform's rotor drag, not a prediction of this quad's"
  note: "decision 0049: opt-in plant drag F_drag = -R D R^T v in the body frame (R body to NED, v the NED velocity relative to still air), in the translational dynamics and in the IMU specific force. Body drag (quadratic in speed) is not modelled. The paper's D has unit 1/s (acceleration per speed); the plant's has unit kg/s (force per speed), hence the factor m. Not a safety number"

rotors:
  layout: quad_x
  thrust_coeff:
    value: 2.8e-6
    unit: N/(rad/s)^2
    method: "derived(k_T = T / omega^2 on the rows of the Emax ECO II 2807-1300KV test table with an Avia 7040-3 prop at 25 V, scaled by the pitch ratio 3.5 / 4 for the HQProp 7x3.5x3; the midpoint of the scaled rows, the range widened to include the unscaled rows)"
    source: "Emax ECO II 2807 1300KV table with the Avia 7040-3 prop at 25 V as posted at https://rcdrone.top/de/products/avia-7035-7-inch-7035-3-fpv-propeller-1cw-1ccw-copy (analyst's reading, M4 P1 packet; rows thrust g / rpm: 480 / 11942, 1000 / 16835, 1640 / 21080, 1990 / 23008, which give k_T = 3.0, 3.2, 3.3, 3.4e-6 N/(rad/s)^2). The pitch ratio 3.5 / 4 is a rough rule (INFERRED); the scaled rows are 2.6-3.0e-6. No published table exists for the 1700KV motor or for the HQProp 7x3.5x3"
    sigma: 0.45e-6
    sigma_rule: "half of the stated range 2.5e-6..3.4e-6: (3.4e-6 - 2.5e-6) / 2"
    status: [INFERRED, PLACEHOLDER]
    placeholder:
      reason: "scaled from a third-party table of another motor (1300KV) and prop (Avia 7040-3); the table starts at 1250 rad/s, above this airframe's hover speed of about 800 rad/s, and k_T rises with speed in it"
      replaced_by: "the M4 thrust stand measurement of this motor, ESC and prop (quad spec §4.0 M4)"
    check: "the thrust stand: thrust against rotor speed at hover speed and above"
  torque_ratio:
    value: 0.012
    unit: m
    method: "derived(c_q = Q / T, Q = eta P_el / omega with an assumed drive efficiency eta = 0.80 and P_el = V I of the same Emax table rows as thrust_coeff)"
    source: "the Emax ECO II 2807 1300KV / Avia 7040-3 table at 25 V posted at https://rcdrone.top/de/products/avia-7035-7-inch-7035-3-fpv-propeller-1cw-1ccw-copy (analyst's reading): rows 480 g (96.25 W), 1000 g (252.5 W), 1640 g (517.5 W), 1990 g (707.5 W) give c_q = 0.0131, 0.0117, 0.0117, 0.0120 m at eta = 0.80 (eta ASSUMED, INFERRED); no pitch scaling is applied"
    sigma: 0.0025
    sigma_rule: "half of the stated range 0.010..0.015 m: (0.015 - 0.010) / 2"
    status: [INFERRED, PLACEHOLDER]
    placeholder:
      reason: "from a third-party table's electrical power at an assumed drive efficiency, for another motor and prop"
      replaced_by: "the M4 thrust stand's torque and thrust measurement (quad spec §4.0 M4)"
    check: "the thrust stand: reaction torque against thrust"
  speed_range:
    value: [0, 2991]
    shape: range
    unit: rad/s
    method: derived(no-load speed KV x V_full x 2π/60; min 0 at the lowest DShot throttle value)
    source: "Luis 2026-10-16: 'set this to max there's no reason to prevent it' and 'other firmwares have no problem leaving this open and using dshot's own range ... if a for the development velocity, then sure' (option a: endpoints at the motor's physical range, so the linear esc_map spans the whole DShot throttle range with no cap). Max = no-load speed on a full pack: KV x V x 2π/60 = 1700 rpm/V x 16.8 V x 2π/60 = 2990.8 rad/s, rounded to 2991; KV from the motor model Luis gave, 'Emax ECO II Series 2807-1700KV Motor' (manufacturer rating); V = 4S x 4.20 V LiPo full charge (INFERRED: the pack's datasheet is not recorded). Min = 0 rad/s at the lowest DShot throttle value (the ESC's own minimum)"
    sigma: UNKNOWN
    status: [INFERRED]
    note: "flatten.py emits speed_range as rotor_speed_min / rotor_speed_max, mixer.py derives idle_speed from its minimum (QF-6's measured minimum stable rotor speed replaces it, mixer.py:6), and the firmware mixer uses all three as rotor speed limits (fw/mixer/src/mixer.cpp). The no-load maximum overstates the loaded speed with 7-inch props; the M4 thrust stand's DShot map replaces esc_map, not this ruling. The AM32 'Motor KV' setting reads 820 on all four ESCs (m1-bench-card.md), not 1700: noticed, not changed"
  motor_lag:
    model: first_order
    tau:
      value: 0.05
      unit: s
      method: "derived(midpoint of the INFERRED range 0.03..0.08 s, which is scaled from the UZH 5-inch motor's 33 ms; no published value for the ECO II 2807 with a 7-inch prop on a Goku G55M)"
      source: "analyst's estimate, M4 P1 packet: no source gives this airframe's motor lag; the UZH NeuroBEM 5-inch value is 33 ms (Bauersfeld et al. 2021 §V-D eq. (20) 'τ_Ω = 33 ms'; blackbird.yaml @ 24f21c4 motor_tau), and a 7-inch prop on a 2807 has more rotor inertia"
      sigma: 0.025
      sigma_rule: "half of the INFERRED range 0.03..0.08 s: (0.08 - 0.03) / 2"
      status: [INFERRED, PLACEHOLDER]
      placeholder:
        reason: "no published value for this motor, ESC and prop; scaled by judgement from another airframe"
        replaced_by: "the M4 thrust stand step response of rotor speed (quad spec §4.0 M4)"
  esc_map:
    model: linear_in_omega
    method: scenario
    source: "the UZH card's scenario model (Luis, 2026-09-29): no source gives a DShot→rotor-speed map for this airframe's ESC and motors"
    sigma: choice
    status: [INFERRED, PLACEHOLDER]
    placeholder:
      reason: "other airframe (UZH NeuroBEM 5in): the UZH card's DShot→rotor-speed model; this airframe's map is unknown (AM32 version and settings UNKNOWN, Luis 2026-10-16)"
      replaced_by: "the M4 thrust stand's DShot-to-thrust map at two pack voltages (quad spec §4.0 M4)"
    note: "endpoints are the DShot throttle range (core §4) and rotors.speed_range (Luis 2026-10-16, [0, 2991] rad/s)"
  m1:
    position:
      value: [0.112, 0.1275, -0.0233]
      shape: frd3
      unit: m
      method: measured
      source: "Luis, 2026-10-16/17, ruler: 'front left to front right distance - ~25.5cm', 'front left to rear left distance - ~22.4cm', 'rear left to front right distance - ~33cm'; x = +-224 / 2 mm and y = +-255 / 2 mm about the frame centre (front-right motor, the M1 measured map and motor_pad); z from vehicles/marv_5in_fc3v2_inertia_model.py (thrust plane 23.3 mm above the model's CG; z is not read by the mixer, the rate loop or the plant torque, which use x and y only)"
      sigma: [0.005, 0.005, 0.010]
      sigma_rule: "the '~' of Luis's ruler readings taken as +-5 mm on each coordinate (1 sigma, conservative: the half-span would be +-2.5 mm); z: the +-10 mm spread of the model's assumed prop-plane height"
      status: [UNVERIFIED, INFERRED]
      check: "a caliper measurement of the four motor centres; the diagonal from the spans is 339 mm, Luis's ruler diagonal rear-left to front-right is ~330 mm and the published wheelbase is 335 mm (9 mm spread, more than the +-5 mm per coordinate), so the rectangle is UNVERIFIED"
      note: "front-right; the centre of the rectangle is taken as the CG in x and y (battery on top, assumed centred); z is INFERRED from the inertia model"
    spin:
      value: ccw
      method: scenario
      source: &spin_source "Luis, 2026-10-16, ruling '5. yes': PX4 quad-X, motors 1 and 2 CCW, 3 and 4 CW (docs/handoff.md, M1 rulings)"
      check: &spin_check "the M1 motor test, props off, spins each logical motor alone; its direction is checked against the card by eye (core §3; quad spec §4.0 M1)"
      note: &spin_note "set at the ESC (AM32 reverse setting), never inverted in firmware (core §3)"
  m2:
    position:
      value: [-0.112, -0.1275, -0.0233]
      shape: frd3
      unit: m
      method: measured
      source: "Luis, 2026-10-16/17, ruler: 'front left to front right distance - ~25.5cm', 'front left to rear left distance - ~22.4cm', 'rear left to front right distance - ~33cm'; x = +-224 / 2 mm and y = +-255 / 2 mm about the frame centre (rear-left motor, the M1 measured map and motor_pad); z from vehicles/marv_5in_fc3v2_inertia_model.py (thrust plane 23.3 mm above the model's CG; z is not read by the mixer, the rate loop or the plant torque, which use x and y only)"
      sigma: [0.005, 0.005, 0.010]
      sigma_rule: "the '~' of Luis's ruler readings taken as +-5 mm on each coordinate (1 sigma, conservative: the half-span would be +-2.5 mm); z: the +-10 mm spread of the model's assumed prop-plane height"
      status: [UNVERIFIED, INFERRED]
      check: "a caliper measurement of the four motor centres; the diagonal from the spans is 339 mm, Luis's ruler diagonal rear-left to front-right is ~330 mm and the published wheelbase is 335 mm (9 mm spread, more than the +-5 mm per coordinate), so the rectangle is UNVERIFIED"
      note: "rear-left; the centre of the rectangle is taken as the CG in x and y (battery on top, assumed centred); z is INFERRED from the inertia model"
    spin:
      value: ccw
      method: scenario
      source: *spin_source
      check: *spin_check
      note: *spin_note
  m3:
    position:
      value: [0.112, -0.1275, -0.0233]
      shape: frd3
      unit: m
      method: measured
      source: "Luis, 2026-10-16/17, ruler: 'front left to front right distance - ~25.5cm', 'front left to rear left distance - ~22.4cm', 'rear left to front right distance - ~33cm'; x = +-224 / 2 mm and y = +-255 / 2 mm about the frame centre (front-left motor, the M1 measured map and motor_pad); z from vehicles/marv_5in_fc3v2_inertia_model.py (thrust plane 23.3 mm above the model's CG; z is not read by the mixer, the rate loop or the plant torque, which use x and y only)"
      sigma: [0.005, 0.005, 0.010]
      sigma_rule: "the '~' of Luis's ruler readings taken as +-5 mm on each coordinate (1 sigma, conservative: the half-span would be +-2.5 mm); z: the +-10 mm spread of the model's assumed prop-plane height"
      status: [UNVERIFIED, INFERRED]
      check: "a caliper measurement of the four motor centres; the diagonal from the spans is 339 mm, Luis's ruler diagonal rear-left to front-right is ~330 mm and the published wheelbase is 335 mm (9 mm spread, more than the +-5 mm per coordinate), so the rectangle is UNVERIFIED"
      note: "front-left; the centre of the rectangle is taken as the CG in x and y (battery on top, assumed centred); z is INFERRED from the inertia model"
    spin:
