# Vehicle card: Luis's 5-inch quad on the madflight FC3v2 Rev-C (quad spec §4.0 M1, M4; core contracts 2.1). Schema and
# sigma policy: tools/card/schema.py. Frames: FRD body, CM origin. Spin: ccw = counter-clockwise viewed from above.
# Hardware (Luis, 2026-10-15): madflight FC3v2 Rev-C, Goku G55M 55A AM32 4-in-1 ESC, flight pack 4S1P 1600 mAh 120C LiPo,
# 14.8 V nominal, 23.68 Wh (quad spec §4.0 M4). Luis, 2026-10-16: motors Emax ECO II Series 2807-1700KV; frame HGLRC
# MY7 7-inch, 335 mm wheelbase, 217 g frame only (this card still carries the UZH 5-inch physics as placeholders). The card schema (tools/card/lint.py) has no pack field, so the pack is
# recorded in this comment only and no tool reads it.
# Physics: every entry is the published value of the UZH NeuroBEM 5-inch card (vehicles/uzh_neurobem_5in.yaml), carried
# as a PLACEHOLDER until the M4 measurements replace it; rotors.speed_range is Luis's ruling of 2026-10-16 (see its source).
vehicle: marv_5in_fc3v2

mass:
  value: 0.772
  unit: kg
  method: published
  source: "NeuroBEM dataset readme, https://rpg.ifi.uzh.ch/neuro_bem/Readme.html ('Our drone has a mass of 0.772 kg')"
  sigma: 0.010
  sigma_rule: "half the spread between the conflicting sources: |0.772 - 0.752| / 2"
  status: [UNVERIFIED, PLACEHOLDER]
  placeholder: &uzh_placeholder
    reason: "other airframe (UZH NeuroBEM 5in): the published value of vehicles/uzh_neurobem_5in.yaml, not a measurement of this airframe"
    replaced_by: "the M4 thrust stand and bifilar pendulum measurements (quad spec §4.0 M4)"
  conflict:
    - value: 0.752
      unit: kg
      source: "Bauersfeld et al., NeuroBEM, RSS 2021, arXiv:2106.08015v1 §IV-B ('total weight of 752 g')"
      state: open
    - value: 0.752
      unit: kg
      source: "uzh-rpg/agile_flight envsim/parameters/quads/blackbird.yaml @ 24f21c4 (mass)"
      state: open
  note: "the UZH card's mass entry with its open conflict"

inertia_diag:
  value: [0.0025, 0.0021, 0.0043]
  shape: diag3
  unit: kg m^2
  method: published
  source: "NeuroBEM dataset readme; uzh-rpg/agile_flight blackbird.yaml @ 24f21c4 (inertia) — agree"
  sigma: UNKNOWN
  status: [PLACEHOLDER]
  placeholder: *uzh_placeholder
  note: "source frame FLU; a diagonal inertia is unchanged by FLU→FRD (180° about x)"

rotors:
  layout: quad_x
  thrust_coeff:
    value: 1.562522e-6
    unit: N/(rad/s)^2
    method: published
    source: "uzh-rpg/agile_flight envsim/parameters/quads/blackbird.yaml @ 24f21c4, thrust_map[0]"
    sigma: UNKNOWN
    status: [INFERRED, PLACEHOLDER]
    placeholder: *uzh_placeholder
    note: "reading thrust_map as [c2, c1, c0] of T = c2 ω² + c1 ω + c0 and its unit are inferred; the file states neither"
  torque_ratio:
    value: 0.022
    unit: m
    method: published
    source: "blackbird.yaml @ 24f21c4, kappa ('# [Nm/N]')"
    sigma: UNKNOWN
    status: [PLACEHOLDER]
    placeholder: *uzh_placeholder
  speed_range:
    value: [0, 2991]
    shape: range
    unit: rad/s
    method: derived(no-load speed KV x V_full x 2π/60; min 0 at the lowest DShot throttle value)
    source: "Luis 2026-10-16: 'set this to max there's no reason to prevent it' and 'other firmwares have no problem leaving this open and using dshot's own range ... if a for the development velocity, then sure' (option a: endpoints at the motor's physical range, so the linear esc_map spans the whole DShot throttle range with no cap). Max = no-load speed on a full pack: KV x V x 2π/60 = 1700 rpm/V x 16.8 V x 2π/60 = 2990.8 rad/s, rounded to 2991; KV from the motor model Luis gave, 'Emax ECO II Series 2807-1700KV Motor' (manufacturer rating); V = 4S x 4.20 V LiPo full charge (INFERRED: the pack's datasheet is not recorded). Min = 0 rad/s at the lowest DShot throttle value (the ESC's own minimum)"
    sigma: UNKNOWN
    status: [INFERRED]
    note: "flatten.py emits speed_range as rotor_speed_min / rotor_speed_max, mixer.py derives idle_speed from its minimum (QF-6's measured minimum stable rotor speed replaces it, mixer.py:6), and the firmware mixer uses all three as rotor speed limits (fw/mixer/src/mixer.cpp). The no-load maximum overstates the loaded speed with 7-inch props; the M4 thrust stand's DShot map replaces esc_map, not this ruling. The AM32 'Motor KV' setting reads 820 on all four ESCs (m1-bench-card.md), not 1700: noticed, not changed"
  motor_lag:
    model: first_order
    tau:
      value: 0.033
      unit: s
      method: published
      source: "Bauersfeld et al. 2021 §V-D eq. (20) ('τ_Ω = 33 ms'); blackbird.yaml @ 24f21c4 motor_tau — agree"
      sigma: UNKNOWN
      status: [PLACEHOLDER]
      placeholder: *uzh_placeholder
  esc_map:
    model: linear_in_omega
    method: scenario
    source: "the UZH card's scenario model (Luis, 2026-09-29): no source gives a DShot→rotor-speed map for this airframe's ESC and motors"
    sigma: choice
    status: [INFERRED, PLACEHOLDER]
    placeholder:
      reason: "other airframe (UZH NeuroBEM 5in): the UZH card's DShot→rotor-speed model; this airframe's map is unknown (AM32 version and settings UNKNOWN, Luis 2026-10-16)"
      replaced_by: "the M4 thrust stand's DShot-to-thrust map at two pack voltages (quad spec §4.0 M4)"
    note: "endpoints are the DShot throttle range (core §4) and rotors.speed_range (Luis 2026-10-16, [0, 2991] rad/s)"
  m1:
    position:
      value: [0.075, 0.10, 0.0]
      shape: frd3
      unit: m
      method: "derived(FLU→FRD: y_FRD = −y_FLU, z_FRD = −z_FLU, from blackbird.yaml @ 24f21c4 tbm_*)"
      source: "uzh-rpg/agile_flight blackbird.yaml @ 24f21c4, tbm_fr/tbm_bl/tbm_fl/tbm_br"
      sigma: UNKNOWN
      status: [PLACEHOLDER]
      placeholder: *uzh_placeholder
      note: "tbm_fr"
    spin:
      value: ccw
      method: scenario
      source: &spin_source "Luis, 2026-10-16, ruling '5. yes': PX4 quad-X, motors 1 and 2 CCW, 3 and 4 CW (docs/handoff.md, M1 rulings)"
      check: &spin_check "the M1 motor test, props off, spins each logical motor alone; its direction is checked against the card by eye (core §3; quad spec §4.0 M1)"
      note: &spin_note "set at the ESC (AM32 reverse setting), never inverted in firmware (core §3)"
  m2:
    position:
      value: [-0.075, -0.10, 0.0]
      shape: frd3
      unit: m
      method: "derived(FLU→FRD: y_FRD = −y_FLU, z_FRD = −z_FLU, from blackbird.yaml @ 24f21c4 tbm_*)"
      source: "uzh-rpg/agile_flight blackbird.yaml @ 24f21c4, tbm_fr/tbm_bl/tbm_fl/tbm_br"
      sigma: UNKNOWN
      status: [PLACEHOLDER]
      placeholder: *uzh_placeholder
      note: "tbm_bl"
    spin:
      value: ccw
      method: scenario
      source: *spin_source
      check: *spin_check
      note: *spin_note
  m3:
    position:
      value: [0.075, -0.10, 0.0]
      shape: frd3
      unit: m
      method: "derived(FLU→FRD: y_FRD = −y_FLU, z_FRD = −z_FLU, from blackbird.yaml @ 24f21c4 tbm_*)"
      source: "uzh-rpg/agile_flight blackbird.yaml @ 24f21c4, tbm_fr/tbm_bl/tbm_fl/tbm_br"
      sigma: UNKNOWN
      status: [PLACEHOLDER]
      placeholder: *uzh_placeholder
      note: "tbm_fl"
    spin:
      value: cw
      method: scenario
      source: *spin_source
      check: *spin_check
      note: *spin_note
  m4:
    position:
      value: [-0.075, 0.10, 0.0]
      shape: frd3
      unit: m
      method: "derived(FLU→FRD: y_FRD = −y_FLU, z_FRD = −z_FLU, from blackbird.yaml @ 24f21c4 tbm_*)"
      source: "uzh-rpg/agile_flight blackbird.yaml @ 24f21c4, tbm_fr/tbm_bl/tbm_fl/tbm_br"
      sigma: UNKNOWN
      status: [PLACEHOLDER]
      placeholder: *uzh_placeholder
      note: "tbm_br"
    spin:
      value: cw
      method: scenario
      source: *spin_source
      check: *spin_check
      note: *spin_note

sensor_profile: madflight_fc3v2_revc
