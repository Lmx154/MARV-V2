  m4:
    position:
      value: [-0.112, 0.1275, -0.0233]
      shape: frd3
      unit: m
      method: measured
      source: "Luis, 2026-10-16/17, ruler: 'front left to front right distance - ~25.5cm', 'front left to rear left distance - ~22.4cm', 'rear left to front right distance - ~33cm'; x = +-224 / 2 mm and y = +-255 / 2 mm about the frame centre (rear-right motor, the M1 measured map and motor_pad); z from vehicles/marv_5in_fc3v2_inertia_model.py (thrust plane 23.3 mm above the model's CG; z is not read by the mixer, the rate loop or the plant torque, which use x and y only)"
      sigma: [0.005, 0.005, 0.010]
      sigma_rule: "the '~' of Luis's ruler readings taken as +-5 mm on each coordinate (1 sigma, conservative: the half-span would be +-2.5 mm); z: the +-10 mm spread of the model's assumed prop-plane height"
      status: [UNVERIFIED, INFERRED]
